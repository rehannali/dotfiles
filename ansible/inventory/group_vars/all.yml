---
# Defaults for every machine. A group (group_vars/<group>.yml) or one host (host_vars/<host>.yml) overrides
# any of these; bootstrap.sh --name/--email override git_name/git_email for one run.

git_name: ""                     # for git commits; asked by nothing, so set it here or pass --name
git_email: ""

# Which parts a machine gets.
gui_apps: true                   # false: command-line tools and terminal setup only (the old "cli" profile)
install_casks: true              # macOS GUI apps (Homebrew casks); needs gui_apps
install_app_store: true          # Mac App Store apps (needs a signed-in App Store); needs gui_apps
macports_fallback: true          # Intel Mac: MacPorts for formulae Homebrew has no bottle for
bitwarden: false                 # chezmoi fetches the secrets in .chezmoidata/secrets.yml from Bitwarden

# Leave single casks / App Store apps out on this kind of machine (cask names as in packages.yml, App Store ids).
casks_skip: []
mas_skip: []
cask_appdir: "~/Applications"    # where casks that ask for an appdir put their .app

# Network hiccups: every install is tried this many times in all, waiting install_delay seconds in between.
# What still fails is reported at the end; the run goes on.
install_retries: 3
install_delay: 10

# The checkout chezmoi applies the dotfiles from (bootstrap.sh clones it here too).
dotfiles_repo: https://github.com/rehannali/dotfiles.git
dotfiles_branch: main
dotfiles_dir: "{{ ansible_facts.env.HOME }}/.local/share/chezmoi"
