---
# Which package manager installs what, per platform. The playbook works out a machine's platform:
#   macos_arm64    Apple Silicon Mac
#   macos_x86_64   Intel Mac
#   debian         Debian, Ubuntu, Raspberry Pi OS (Pi 4, arm64), WSL, Hetzner's images: any Debian-family Linux
#
#   cli     command-line tools (kind cli, and anything with a mise key):   brew | mise
#   system  libraries, daemons, big tools (kind system / apple):           brew | apt | port
#   apps    GUI apps, in order of preference:                              cask, mas | flatpak
#
# On an Intel Mac there is no Homebrew: `system: brew` names the Homebrew formula, and mycask (tools/mycask) installs
# it from a Homebrew bottle, a bottle this repo's CI built, the tool's MacPorts `port`, or its `mise_fallback`, else
# reports it (nothing is compiled). `cask` apps come from mycask too. This stays as it is after Homebrew drops Intel
# (1 September 2027); tools/mycask/README.md has the timeline.
platform_managers:
  macos_arm64: {cli: brew, system: brew, apps: [cask, mas]}
  macos_x86_64: {cli: mise, system: brew, apps: [cask, mas]}
  debian: {cli: mise, system: apt, apps: [flatpak]}
