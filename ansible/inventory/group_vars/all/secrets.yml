---
# Environment variables whose values are kept in Bitwarden instead of in this repo.
#
# They only take effect when Bitwarden is switched on (`bitwarden: true` in main.yml or for a group/host, or
# bootstrap.sh --bitwarden). The dotfiles role then writes them as `export NAME='value'` to
# ~/.config/dotfiles/secrets.zsh (mode 600), which .zshrc and .bashrc read. Without Bitwarden nothing is fetched
# and no file is written. The vault has to be unlocked (BW_SESSION); bootstrap.sh does that.
#
# item   name (or id) of the Bitwarden item
# field  password (default) | username | notes | the name of a custom field on the item
#
# Example:
#
#   secrets:
#     env:
#       GITHUB_TOKEN:
#         item: GitHub personal access token
#       NPM_TOKEN:
#         item: npmjs
#         field: token          # a custom field called "token"
secrets:
  env: {}
