---
# What every machine gets. A kind of machine (group_vars/<group>.yml) or one machine (host_vars/<host>.yml)
# overrides any of these. A list or dict set there replaces this one, it is not merged with it.
# This machine's own choices (bootstrap.sh options, dot remember) live outside the repo in
# ~/.config/dotfiles/local.yml and win over group_vars. The other files here: packages.yml (the
# packages, in bundles), platforms.yml (which package manager installs what on each OS), settings.yml (taste: git,
# terminal, Dock, shell), secrets.yml (Bitwarden), toolchain.yml (Xcode).

# for git commits, the first one there: the Bitwarden fields git_name / git_email (dotfiles.all, dotfiles.<group>,
# dotfiles.<host>; docs/bitwarden.md), then DOTFILES_NAME / DOTFILES_EMAIL (bootstrap.sh --name / --email), then
# what you typed once (git_name_asked / git_email_asked in ~/.config/dotfiles/local.yml)
git_name: >-
  {{ private_host.git_name | default(lookup('ansible.builtin.env', 'DOTFILES_NAME'), true)
     | default(git_name_asked | default(''), true) }}
git_email: >-
  {{ private_host.git_email | default(lookup('ansible.builtin.env', 'DOTFILES_EMAIL'), true)
     | default(git_email_asked | default(''), true) }}

# --- Which parts a machine gets
gui_apps: true                   # false: command-line tools and terminal setup only (servers, WSL)
install_casks: true              # macOS GUI apps (Homebrew casks; mycask on Intel Macs); needs gui_apps
install_app_store: true          # Mac App Store apps (needs a signed-in App Store); needs gui_apps
install_flatpaks: true           # Linux GUI apps from Flathub; needs gui_apps
install_snaps: true              # Linux GUI apps without a flatpak, from the Snap Store (installs snapd if missing); needs gui_apps
macports_fallback: true          # Intel Mac: MacPorts for the command-line tools (false: none from MacPorts)
upgrade_on_apply: true           # every run also upgrades: MacPorts, mise, Homebrew (Apple Silicon), casks (mycask on Intel)
mycask_adopt: false              # Intel Mac: true = mycask takes over apps already in place (first run after Homebrew)
macos_defaults: true             # Dock, Finder and trackpad settings (settings.yml macos); needs gui_apps
touch_id_sudo: true              # Touch ID for sudo on a Mac with a sensor, macOS 14+
install_xcode: true              # Xcode with xcodes (needs your Apple ID, see docs/bitwarden.md); needs gui_apps
install_ios_runtime: true        # the iOS simulator runtime that goes with that Xcode
install_flutter: true            # Flutter with fvm (settings.yml flutter.version); needs gui_apps
login_shell_zsh: true            # make zsh the login shell
# fetch the secrets in secrets.yml and the Apple ID from Bitwarden; on by itself when this run reads the vault
bitwarden: "{{ private_source | default('') is search('^Bitwarden') }}"

# --- Packages: the bundles from packages.yml this machine gets (each group sets its own), and single entries on top
bundles: [core]
tools_extra: []                  # more entries in the packages.yml `tools` format
tools_skip: []                   # tool names (the `name` key) this machine does not get
apps_extra: []                   # more apps in the packages.yml `apps` format, e.g. [{name: slack, cask: slack, flatpak: com.slack.Slack}]
apps_skip: []                    # app names (the `name` key)

# Uninstalled on every run, so a package you no longer want goes away everywhere. Deleting an entry from the lists
# above only stops installing it; to take it off machines that have it, put it here. Run with --check first to see
# what would go.
remove:
  brew: [git-flow, stow]         # Homebrew formulae (git-flow-next replaces git-flow; stow is not used)
  cask: []                       # Homebrew casks
  mas: []                        # App Store ids
  apt: [git-flow]                # Debian packages (git-flow-next comes from mise there)
  mise: [chezmoi]                # mise tool ids (also dropped from the mise config); chezmoi is not used
  port: []                       # MacPorts ports (Intel Macs)
  flatpak: []                    # Flathub ids (Linux desktops)
  snap: []                       # Snap Store names (Linux desktops)

# --- Network hiccups: every install is tried this many times in all, waiting install_delay seconds in between.
# What still fails is reported at the end; the run goes on.
install_retries: 3
install_delay: 10

# --- Where the repo lives on the machine. The dotfiles in home/ are linked from here, so editing ~/.zshrc edits
# the checkout (commit and push from there). Setting up the machine the playbook runs on: the checkout it runs from,
# wherever you cloned it (bootstrap.sh and dot pass it too). A machine reached over SSH: ~/.dotfiles there, cloned
# by the run; set dotfiles_dir in its host_vars for another place.
dotfiles_repo: https://github.com/rehannali/dotfiles.git
dotfiles_branch: main
dotfiles_dir: >-
  {{ (playbook_dir ~ '/..') | realpath if (ansible_connection | default('ssh')) == 'local'
     else ansible_facts.env.HOME ~ '/.dotfiles' }}
