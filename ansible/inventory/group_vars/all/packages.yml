# Package data: everything any machine can get, in bundles. A kind of machine picks bundles in
# group_vars/<group>.yml (`bundles: [core, dev, ...]`), one machine can add or leave out single entries
# (tools_extra / tools_skip / apps_extra / apps_skip in host_vars/<host>.yml), and `remove:` uninstalls (main.yml).
#
# A bundle can have:
#   tools     command-line tools, libraries and daemons (format below)
#   apps      GUI apps (format below)
#   runtimes  languages mise installs (node, python, ...): a version, lts or latest
#   npm       global npm packages, installed with mise's node
#   gems      Ruby gems installed into mise's Ruby (macOS)
#
# --- tools: one entry per tool, with the name each package manager knows it by. Leave a key out where the tool is
# not available from that manager.
#
#   name        canonical name (logs, tools_skip)
#   kind        cli    single-binary tool that mise can install from a prebuilt release
#               system libraries, daemons and big apps that need brew / apt
#               apple  Apple-developer tool, macOS only (and only with gui_apps)
#   mise        mise tool id: registry short name, or backend:owner/repo
#   brew        Homebrew formula (tap formulae fully qualified)
#   apt         Debian/Ubuntu package
#   The keys below (port to download) only count on an Intel Mac, which has no Homebrew: a tool comes from its
#   `port` if it has one, else from mise (`mise_intel`, else `mise`, else `mise_fallback`), else `download`, else it
#   is reported. Its GUI apps (casks) come from mycask. CLI tools that ship as casks (claude-code, codex) are apps.
#   port        MacPorts port. Only set where packages.macports.org has an Intel archive for the current macOS, so
#               nothing is compiled, unless port_build says otherwise. If it does not install (no archive for an older
#               macOS), the tool's mise id or mise_fallback is used; one with neither is built by MacPorts instead.
#               Afterwards `port rev-upgrade` rebuilds a port whose archive links a library version that is gone.
#   port_build  true = MacPorts has no archive for the port itself (git, autoconf, automake): it is built, a few
#               minutes, after every dependency came as an archive. Never a chain of builds.
#   port_select [group, choice]: `port select --set` after installing (php85 as php, pygmentize from py314-pygments)
#   port_links  {command: path}: a link in ~/.local/bin for a port that installs the command under another name
#               (telnet is gtelnet) or somewhere else (docker-compose is a docker CLI plugin)
#   mise_fallback  a mise tool id for a tool with no port (ansible: pipx:ansible-core), or whose port failed
#   mise_intel  a mise id to use on Intel Macs instead of `mise`: "cargo:<crate>" builds the crate with mise's Rust
#               (eza: no Intel build anywhere else)
#   download    URL of a .tgz with the command at its top level (speedtest: Ookla's own universal build), put in
#               ~/.local/bin; again when the URL changes
#   brew_service  true = start it with `brew services` once Homebrew installed it (apt starts its own services)
#   prebuilt    true  = tap formula that downloads a prebuilt binary (no bottle, no compile)
#   bin         command the tool provides when it differs from `name` (cli/apple default to `name`;
#               system entries have none unless set). Used by scripts/check-install.py after an apply.
#
# Which manager installs a tool on a machine is decided by platform_managers (platforms.yml) and
# ansible/filter_plugins/tool_plan.py; a tool is never installed by two managers on one machine.
#
# --- apps: one entry per app, with its id for each store. An app reaches a machine only where it has an id:
#
#   name        canonical name (logs, apps_skip)
#   cask        Homebrew cask (macOS)          appdir: true = into settings.macos.cask_appdir, not /Applications
#   mas         Mac App Store id (macOS)       arch: arm64 = Apple Silicon only
#   flatpak     Flathub id (Linux desktops)
#   snap        Snap Store name (Linux desktops): used when the app has no flatpak (platforms.yml: flatpak first).
#               Only a snap from the vendor (or a known maintainer); `snap_classic: true` for classic confinement
#   deb         the vendor's own apt repository (Debian / Ubuntu desktops), for an app in neither store:
#               {package, keyring: URL of its signing key, sources: URL of its deb822 .sources file}
#   github      owner/repo of an app that only ships in GitHub releases (macOS, installed like a cask): the latest
#               release's `asset` (a regex for a .zip) is unpacked, its signature checked (Developer ID, Gatekeeper)
#               and `app` (MacTap.app) copied into /Applications; again when a newer release comes out
#   macbook     true = MacBooks only (needs the laptop's hardware)
#
# List what you want, not what it needs. A package that another listed package already installs as a runtime
# dependency, with the same manager on the same machine, is left out (glib, libimobiledevice, ...), and the
# entry says where it comes from. Keep an entry when the package that brings it may be in a bundle a machine
# doesn't have (git is listed in core although another package in dev may bring it). Build-only dependencies do
# not count: a bottle or a prebuilt binary never installs them.
packages:
  taps:
    # Each tap is trusted as a whole right after it is tapped (Homebrew loads nothing from an untrusted tap). formulae
    # and casks list what is used from it; packages_check.py makes sure every tool or app from a tap is listed here.
    # nothing from this tap is used (the font-* casks below all come from homebrew/cask); to use one of its casks,
    # list it: {name: colindean/fonts-nonfree, casks: [font-microsoft-office]}
    # - {name: colindean/fonts-nonfree, casks: [font-microsoft-office]}
    # - {name: ferdium/ferdium, casks: [ferdium]}   # only for the ferdium cask, which is commented out
    - {name: leoafarias/fvm, formulae: [fvm]}
    - {name: netbirdio/tap, casks: [netbird-ui]}   # the cask also pulls in the tap's netbird formula
    - {name: teamookla/speedtest, formulae: [speedtest]}
    - {name: withgraphite/tap, formulae: [graphite]}   # prebuilt binary
    - {name: xcodesorg/made, formulae: [xcodes]}


  bundles:
    # Every machine: the shell and the everyday command-line tools.
    core:
      tools:
        - {name: atuin, kind: cli, mise: atuin, brew: atuin, port: atuin, apt: atuin}
        - {name: bat, kind: cli, mise: bat, brew: bat, port: bat, apt: bat}
        - {name: btop, kind: cli, mise: btop, brew: btop, port: btop, apt: btop}
        - {name: bitwarden-cli, kind: cli, mise: bitwarden, brew: bitwarden-cli, port: bitwarden-cli, bin: bw}
        - {name: dust, kind: cli, mise: dust, brew: dust, port: dust}
        - {name: eza, kind: cli, mise: eza, mise_intel: "cargo:eza", brew: eza, apt: eza}   # Intel: no MacPorts archive, mise builds it
        - {name: fastfetch, kind: cli, mise: fastfetch, brew: fastfetch, port: fastfetch, apt: fastfetch}   # replaces neofetch
        - {name: gh, kind: cli, mise: gh, brew: gh, port: gh, apt: gh}
        - {name: glab, kind: cli, mise: glab, brew: glab, port: glab}
        - {name: git-delta, kind: cli, mise: delta, brew: git-delta, port: git-delta, apt: git-delta, bin: delta}
        - {name: git-lfs, kind: cli, mise: git-lfs, brew: git-lfs, port: git-lfs, apt: git-lfs}
        - {name: lsd, kind: cli, mise: lsd, brew: lsd, port: lsd, apt: lsd}
        - {name: neovim, kind: cli, mise: aqua:neovim/neovim, brew: neovim, port: neovim, apt: neovim, bin: nvim}
        - {name: rclone, kind: cli, mise: rclone, brew: rclone, port: rclone, apt: rclone}
        - {name: tmux, kind: cli, mise: tmux, brew: tmux, port: tmux, apt: tmux}
        - {name: zoxide, kind: cli, mise: zoxide, brew: zoxide, port: zoxide, apt: zoxide}
        - {name: coreutils, kind: system, brew: coreutils, port: coreutils}
        - {name: curl, kind: system, apt: curl, bin: curl}
        - {name: file, kind: system, apt: file}
        - {name: git, kind: system, brew: git, port: git, port_build: true, apt: git, bin: git}   # MacPorts has no archive: built (minutes)
        - {name: htop, kind: system, brew: htop, port: htop, apt: htop, bin: htop}
        - {name: pwgen, kind: system, brew: pwgen, port: pwgen, apt: pwgen, bin: pwgen}
        - {name: rsync, kind: system, brew: rsync, port: rsync, apt: rsync, bin: rsync}
        - {name: thefuck, kind: system, brew: thefuck, port: thefuck, bin: thefuck}
        - {name: unzip, kind: system, apt: unzip, bin: unzip}
        - {name: zip, kind: system, apt: zip}
        - {name: zsh, kind: system, brew: zsh, port: zsh, apt: zsh, bin: zsh}

    # Languages from mise, and what is installed with them. Without this bundle a machine has no node/python/...
    runtimes:
      runtimes:
        node: lts
        python: "3.15"   # global; a project picks another in its mise.toml
        uv: latest
        ruby: "3.3"
        java: [corretto-21, corretto-17]   # first entry is the default
        go: latest
        rust: latest
      npm:
        - localtunnel
        - firebase-tools

    # Building and shipping software.
    dev:
      tools:
        - {name: act, kind: cli, mise: act, brew: act, port: act}
        - {name: cmake, kind: cli, mise: cmake, brew: cmake, port: cmake, apt: cmake}
        - {name: deno, kind: cli, mise: deno, brew: deno, port: deno}
        - {name: docker, kind: cli, mise: docker-cli, brew: docker, port: docker}
        - {name: docker-compose, kind: cli, mise: docker-compose, brew: docker-compose, port: docker-compose-plugin,
           port_links: {docker-compose: /opt/local/libexec/docker/cli-plugins/docker-compose}}   # Compose v2 (the docker-compose port is v1)
        - {name: fvm, kind: cli, mise: aqua:leoafarias/fvm, brew: leoafarias/fvm/fvm}
        - {name: graphite, kind: cli, mise: graphite, brew: withgraphite/tap/graphite, bin: gt}   # stacked PRs
        - {name: mkcert, kind: cli, mise: mkcert, brew: mkcert, port: mkcert, apt: mkcert}
        - {name: payload-dumper-go, kind: cli, mise: github:ssut/payload-dumper-go, brew: payload-dumper-go}
        - {name: pipx, kind: cli, mise: pipx, brew: pipx, apt: pipx}
        - {name: poetry, kind: cli, mise: pypi:poetry, brew: poetry, apt: python3-poetry}
        - {name: pygments, kind: cli, mise: pypi:pygments, brew: pygments, port: py314-pygments, port_select: [pygments, py314-pygments],
           apt: python3-pygments, bin: pygmentize}
        - {name: zig, kind: cli, mise: zig, brew: zig}
        - {name: ansible, kind: system, brew: ansible, mise_fallback: pipx:ansible-core, apt: ansible, bin: ansible}   # Intel: ansible-core from mise
        - {name: aria2, kind: system, brew: aria2, port: aria2, apt: aria2, bin: aria2c}   # also makes xcodes downloads faster
        - {name: autoconf, kind: system, brew: autoconf, port: autoconf, port_build: true, bin: autoconf}   # apt: comes with automake. MacPorts: no archive, built
        - {name: automake, kind: system, brew: automake, port: automake, port_build: true, apt: automake, bin: automake}
        - {name: build-essential, kind: system, apt: build-essential}
        - {name: gcc, kind: system, brew: gcc, port: gcc14}   # apt: comes with build-essential
        # git-flow-next, the maintained rewrite, replaces git-flow: Homebrew declares them in conflict (both provide the
        # `git-flow` command). remove: in main.yml uninstalls the old one. Macs: Homebrew (mycask on Intel); Linux: mise.
        - {name: git-flow-next, kind: cli, mise: "github:gittower/git-flow-next", brew: git-flow-next, bin: git-flow}
        # - {name: glib, kind: system, brew: glib, apt: libglib2.0-dev}   # brew: comes with harfbuzz and ghostscript. apt: comes with libharfbuzz-dev
        - {name: harfbuzz, kind: system, apt: libharfbuzz-dev}   # brew: comes with ghostscript. apt: libharfbuzz-dev pulls in libglib2.0-dev
        - {name: libksba, kind: system, brew: libksba, port: libksba, apt: libksba-dev}
        - {name: libyaml, kind: system, apt: libyaml-dev}   # brew: comes with ansible
        - {name: openssl, kind: system, brew: openssl@3, port: openssl3, apt: libssl-dev}
        - {name: pkgconf, kind: system, brew: pkgconf, port: pkgconfig, port_links: {pkgconf: /opt/local/bin/pkg-config},
           bin: pkgconf}   # apt: comes with libharfbuzz-dev. MacPorts: pkgconfig (other ports need it, and it conflicts with pkgconf)
        - {name: subversion, kind: system, brew: subversion, port: subversion, apt: subversion, bin: svn}
        - {name: zlib, kind: system, brew: zlib, port: zlib}   # apt: zlib1g-dev comes with libharfbuzz-dev
        # needed by the Flutter SDK (fvm) on Debian: it unpacks .tar.xz and zip files and calls `file`
        # - {name: xz-utils, kind: system, apt: xz-utils}   # comes with build-essential (through dpkg-dev)

    # Images, video and documents on the command line.
    media:
      tools:
        - {name: ffmpeg, kind: system, brew: ffmpeg, port: ffmpeg, apt: ffmpeg, bin: ffmpeg}
        - {name: ghostscript, kind: system, brew: ghostscript, port: ghostscript, apt: ghostscript, bin: gs}
        - {name: graphicsmagick, kind: system, brew: graphicsmagick, port: GraphicsMagick, apt: graphicsmagick, bin: gm}
        - {name: imagemagick, kind: system, brew: imagemagick, port: ImageMagick, apt: imagemagick, bin: convert}
        - {name: libheif, kind: system, apt: libheif-dev}   # brew: comes with imagemagick and graphicsmagick

    # Network tools.
    network:
      tools:
        - {name: nmap, kind: system, brew: nmap, port: nmap, apt: nmap, bin: nmap}
        - {name: openconnect, kind: system, brew: openconnect, port: openconnect, apt: openconnect, bin: openconnect}
        - {name: speedtest, kind: system, brew: teamookla/speedtest/speedtest, prebuilt: true, bin: speedtest,
           download: "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-macosx-universal.tgz"}   # Intel: Ookla's own build
        - {name: telnet, kind: system, brew: telnet, port: inetutils, port_links: {telnet: /opt/local/bin/gtelnet}, apt: telnet, bin: telnet}
        - {name: unbound, kind: system, brew: unbound, port: unbound, apt: unbound}
        - {name: wireguard-tools, kind: system, brew: wireguard-tools, port: wireguard-tools, apt: wireguard-tools, bin: wg}

    # A local web stack.
    web:
      tools:
        - {name: nginx, kind: system, brew: nginx, port: nginx, apt: nginx, brew_service: true}
        - {name: php, kind: system, brew: php, port: php85, port_select: [php, php85], apt: php-cli, bin: php}

    # Apple development (macOS, with gui_apps): command-line tools, gems, Xcode extensions. Xcode itself is the xcode
    # role (install_xcode). The gems need the runtimes bundle (mise's Ruby).
    mac_dev:
      tools:
        - {name: carthage, kind: apple, brew: carthage, port: carthage}
        # also installs libimobiledevice (ideviceinfo, idevicesyslog, ...)
        - {name: ideviceinstaller, kind: apple, brew: ideviceinstaller, port: ideviceinstaller}
        - {name: ios-deploy, kind: apple, brew: ios-deploy, port: ios-deploy}
        - {name: swiftlint, kind: apple, mise: swiftlint, brew: swiftlint, port: swiftlint}
        - {name: xcodes, kind: apple, mise: xcodes, brew: xcodesorg/made/xcodes, port: xcodes, bin: xcodes}
      gems:
        - fastlane
        - cocoapods
        - cocoapods-keys
      apps:
        - {name: github-copilot-for-xcode, cask: github-copilot-for-xcode}
        - {name: swiftify-for-xcode, mas: 1183412116}
        - {name: comment-wrapper-for-xcode, mas: 1377998565}
        - {name: xcformat, mas: 1165321484}

    # Nerd fonts and coding fonts the terminal configs use (macOS).
    fonts:
      apps:
        - {name: font-cascadia-code, cask: font-cascadia-code}
        - {name: font-cascadia-code-pl, cask: font-cascadia-code-pl}
        - {name: font-caskaydia-cove-nerd-font, cask: font-caskaydia-cove-nerd-font}
        - {name: font-fira-code, cask: font-fira-code}
        - {name: font-fira-code-nerd-font, cask: font-fira-code-nerd-font}
        - {name: font-hack-nerd-font, cask: font-hack-nerd-font}
        - {name: font-jetbrains-mono-nerd-font, cask: font-jetbrains-mono-nerd-font}
        - {name: font-meslo-lg-nerd-font, cask: font-meslo-lg-nerd-font}
        - {name: font-sauce-code-pro-nerd-font, cask: font-sauce-code-pro-nerd-font}
        - {name: font-source-code-pro, cask: font-source-code-pro}

    # Terminals, editors, git clients, API and device tools.
    apps_dev:
      apps:
        - {name: android-file-transfer, cask: android-file-transfer, appdir: true}
        - {name: android-platform-tools, cask: android-platform-tools, appdir: true}
        - {name: balenaetcher, cask: balenaetcher, appdir: true}
        - {name: bruno, cask: bruno, appdir: true, flatpak: com.usebruno.Bruno}
        - {name: claude-code, cask: claude-code}   # command line only (no .app); mycask on Intel Macs
        - {name: codex, cask: codex}   # command line only (no .app); mycask on Intel Macs
        - {name: figma, cask: figma, appdir: true}
        - {name: ghostty, cask: ghostty}
        - {name: gitkraken, cask: gitkraken, appdir: true, flatpak: com.axosoft.GitKraken}
        - {name: iterm2, cask: iterm2, appdir: true}
        - {name: jetbrains-toolbox, cask: jetbrains-toolbox}
        - {name: orbstack, cask: orbstack}
        - {name: qlmarkdown, cask: qlmarkdown}
        - {name: quicklook-video, cask: quicklook-video}   # was qlvideo
        - {name: sourcetree, cask: sourcetree}
        - {name: suspicious-package, cask: suspicious-package}
        - {name: termius, cask: termius, flatpak: com.termius.Termius}
        - {name: tower, cask: tower, appdir: true}   # Git Tower; needs macOS 14 or newer (universal binary)
        - {name: visual-studio-code, cask: visual-studio-code, flatpak: com.visualstudio.code}
        - {name: vscodium, cask: vscodium, appdir: true, flatpak: com.vscodium.codium}
        - {name: wezterm, cask: wezterm, flatpak: org.wezfurlong.wezterm}
        # - {name: alacritty, cask: alacritty, appdir: true}   # not used; the cask is also disabled upstream (2026-09-01)
        # - {name: postman, cask: postman}   # not used
        # - {name: warp, cask: warp}   # not used

    # Browsers, office, notes, passwords, file sharing: what a work machine needs too.
    apps_productivity:
      apps:
        - {name: alfred, cask: alfred, appdir: true}
        - {name: bitwarden, cask: bitwarden, appdir: true, flatpak: com.bitwarden.desktop}
        # Brave Origin: no flatpak or snap (Flathub and the Snap Store only have the regular Brave), so Linux takes
        # Brave's own apt repository (brave.com/origin/linux, free on Linux; amd64 and arm64)
        - {name: brave, cask: brave-origin, appdir: true,
           deb: {package: brave-origin, keyring: "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg",
                 sources: "https://brave-browser-apt-release.s3.brave.com/brave-browser.sources"}}
        - {name: chatgpt, cask: chatgpt, appdir: true}
        - {name: claude, cask: claude, appdir: true}
        - {name: clop, cask: clop}   # image / video / PDF optimiser on the clipboard
        - {name: easyfind, cask: easyfind, appdir: true}
        - {name: ente-auth, cask: ente-auth, appdir: true, flatpak: io.ente.auth}
        - {name: firefox, cask: firefox, appdir: true, flatpak: org.mozilla.firefox}
        - {name: forel, cask: forel}
        - {name: google-chrome, cask: google-chrome, appdir: true, flatpak: com.google.Chrome}
        - {name: google-drive, cask: google-drive}
        - {name: handy, cask: handy}   # offline speech to text
        - {name: headjust, mas: 6759303637}   # App Store only; macOS 15.6 or newer
        - {name: itsycal, cask: itsycal, appdir: true}
        - {name: localsend, cask: localsend, appdir: true, flatpak: org.localsend.localsend_app}
        - {name: macfuse, cask: macfuse}
        - {name: macpacker, cask: macpacker}   # archive manager; macOS 14 or newer
        # knock the MacBook to run shortcuts; no cask, from its GitHub releases. Needs an M2 or later (or M1 Pro / Max /
        # Ultra) MacBook and macOS 14.6 or newer
        - {name: mactap, github: jaskirat1616/mactap-app, asset: 'MacTap-.*\.zip$', app: MacTap.app, arch: arm64, macbook: true}
        - {name: macusb, cask: macusb}   # macOS USB installer maker; macOS 14 or newer
        - {name: microsoft-auto-update, cask: microsoft-auto-update}
        - {name: microsoft-office, cask: microsoft-office}
        - {name: microsoft-teams, cask: microsoft-teams}
        - {name: mole, cask: mole-app}   # Mac cleaner and optimiser; macOS 14 or newer
        - {name: notion, cask: notion}
        - {name: prefab, mas: 6758208322}   # App Store only
        - {name: readdle-spark, cask: readdle-spark}
        - {name: rustdesk, cask: rustdesk, flatpak: com.rustdesk.RustDesk}
        - {name: simpholders, cask: simpholders}
        - {name: text-toolset, mas: 1157225201}
        - {name: textream, cask: textream}   # teleprompter; macOS 15 or newer
        - {name: vorssaint, cask: vorssaint, arch: arm64}   # Apple Silicon only
        - {name: wordcraft, cask: wordcraft}
        - {name: zoom, cask: zoom, flatpak: us.zoom.Zoom}
        # - {name: 1password, cask: 1password}   # not used
        # - {name: 1password-cli, cask: 1password-cli}   # not used
        # - {name: ferdium, cask: ferdium, appdir: true}   # not used (needs the ferdium/ferdium tap)
        # - {name: karabiner-elements, cask: karabiner-elements}   # not used
        # - {name: languagetool-desktop, cask: languagetool-desktop}   # not used
        # - {name: ticktick, cask: ticktick}   # not used
        # - {name: xcodes-app, cask: xcodes-app}   # not used

    # VPNs, firewalls and remote networks.
    apps_network:
      apps:
        - {name: little-snitch, cask: little-snitch}
        - {name: micro-snitch, cask: micro-snitch}
        - {name: netbird-ui, cask: netbirdio/tap/netbird-ui, snap: netbird}   # cask from the netbirdio/tap tap; snap: client and daemon (no UI snap)
        - {name: nordvpn, cask: nordvpn, snap: nordvpn}
        - {name: openvpn-connect, cask: openvpn-connect}
        - {name: surfshark, cask: surfshark, snap: surfshark}
        - {name: tailscale, cask: tailscale-app, snap: tailscale}
        - {name: twingate, cask: twingate}
        - {name: windscribe, cask: windscribe}
        - {name: wireguard, mas: 1451685025}

    # Music, video, chat and the rest of a personal machine.
    apps_personal:
      apps:
        - {name: adobe-creative-cloud, cask: adobe-creative-cloud, appdir: true}
        - {name: discord, cask: discord, appdir: true, flatpak: com.discordapp.Discord}
        - {name: hp-easy-start, cask: hp-easy-start}
        - {name: iina, cask: iina}
        - {name: kodi, cask: kodi, flatpak: tv.kodi.Kodi}
        - {name: mactracker, mas: 430255202}
        - {name: setapp, cask: setapp}
        - {name: snagit, cask: snagit}
