---
# Every machine this repo sets up, by kind. What a kind gets is in group_vars/<group>.yml, a single machine's
# exceptions in host_vars/<host>.yml. The host names below are examples: rename them to your machines.
#
#   On the machine itself:   bootstrap.sh --host macbook
#   From your laptop:        ansible-playbook site.yml -l piserver -K      (or -l servers, or everything)
#   A machine not listed:    bootstrap.sh --host new-mac --group mac_work
#
# Hosts you only set up on the machine itself need no address. Hosts you push to need ansible_host (name or IP)
# and ansible_user, and an SSH key that machine accepts.
all:
  children:
    macs:
      children:
        mac_personal:
          hosts:
            macbook:
            mbp-onikage:             # Intel MacBook Pro: apps and tools from mycask, no Homebrew
        mac_work:
          hosts:
            office-mac:
    servers:
      hosts:
        piserver:                # the Raspberry Pi 4 (BIND on the firewall resolves the name inside the network)
          ansible_host: piserver.homelab.xynlab.uk
          ansible_user: onikage
        # hetzner:               # a VPS
        #   ansible_host: 203.0.113.10
        #   ansible_user: rehan
    wsl:
      hosts:
        wsl-ubuntu:
    linux_desktop:
      hosts:
        linux-laptop:
