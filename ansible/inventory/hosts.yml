---
# Every machine this repo sets up, by kind. What a kind gets is in group_vars/<group>.yml, a single machine's
# exceptions in host_vars/<host>.yml. The host names below are examples: rename them to your machines.
#
#   On the machine itself:   bootstrap.sh --home   (or --office; --host NAME, default its hostname)
#   From your laptop:        ansible-playbook site.yml -l piserver -K      (or -l servers, or everything)
#   A machine not listed:    bootstrap.sh --group servers   (--home / --office for a Mac)
#
# Hosts you only set up on the machine itself need no address. Hosts you push to need ansible_host (name or IP)
# and ansible_user, and an SSH key that machine accepts.
all:
  children:
    # Macs are not listed: a Mac joins mac_personal (bootstrap.sh --home) or mac_work (--office) under its own
    # hostname, and Intel or Apple Silicon is detected. List one here only to give it host_vars of its own.
    macs:
      children:
        mac_personal: {}
        mac_work: {}
    servers:
      hosts:
        piserver:                # the Raspberry Pi 4. Address, user and port are private (Bitwarden, docs/bitwarden.md)
          ansible_host: "{{ private.piserver.host }}"
          ansible_user: "{{ private.piserver.user }}"
          ansible_port: "{{ private.piserver.ssh_port }}"   # host_vars/piserver.yml moves SSH there (a fresh OS: -e ansible_port=22 once)
        # hetzner:               # a VPS
        #   ansible_host: 203.0.113.10
        #   ansible_user: rehan
    wsl:
      hosts:
        wsl-ubuntu:
    linux_desktop:
      hosts:
        linux-laptop:
