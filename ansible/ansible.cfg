[defaults]
inventory = inventory/hosts.yml
roles_path = roles
filter_plugins = filter_plugins
vars_plugins = vars_plugins
# private: personal and secret values from Bitwarden (vars_plugins/private.py)
vars_plugins_enabled = host_group_vars,private
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False
nocows = 1

[ssh_connection]
pipelining = True
