---
# What gets installed is tool_plan (which manager for each tool) and apps_wanted (GUI apps), both worked out in
# site.yml from the machine's bundles and its platform's managers (platforms.yml).
- name: Apt (Debian, Ubuntu, Raspberry Pi OS, WSL)
  ansible.builtin.include_tasks: debian.yml
  when: pkg_managers.system == 'apt'

- name: MacOS
  ansible.builtin.include_tasks: darwin.yml
  when: dotfiles_os == 'darwin'

- name: Flatpak apps (Linux desktops)
  ansible.builtin.include_tasks: flatpak.yml
  when: flatpak_apps | length > 0 or ('flatpak' in pkg_managers.apps | default([]) and remove.flatpak | default([]) | length > 0)

- name: Apps from their vendor's apt repository (Linux desktops, in neither store)
  ansible.builtin.include_tasks: deb_apps.yml
  when: deb_apps | length > 0

- name: Snap apps (Linux desktops, apps without a flatpak)
  ansible.builtin.include_tasks: snap.yml
  when: snap_apps | length > 0 or ('snap' in pkg_managers.apps | default([]) and remove.snap | default([]) | length > 0)
