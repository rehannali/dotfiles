---
- name: Debian-based Linux
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts.os_family == 'Debian'

- name: Other Linux
  ansible.builtin.set_fact:
    install_failures: >-
      {{ install_failures | default([]) + ['packages: ' ~ ansible_facts.distribution ~ ' has no package list here (only Debian-based Linux)'] }}
  when: ansible_facts.system == 'Linux' and ansible_facts.os_family != 'Debian'

- name: MacOS
  ansible.builtin.include_tasks: darwin.yml
  when: ansible_facts.system == 'Darwin'
