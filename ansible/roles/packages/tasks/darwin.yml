---
- name: Homebrew | where is it
  ansible.builtin.set_fact:
    brew_prefix: "{{ '/opt/homebrew' if ansible_facts.architecture == 'arm64' else '/usr/local' }}"
    intel_mac: "{{ ansible_facts.architecture != 'arm64' }}"

- name: Homebrew | installed?
  ansible.builtin.stat:
    path: "{{ brew_prefix }}/bin/brew"
  register: brew_stat

- name: Homebrew | missing
  ansible.builtin.set_fact:
    install_failures: >-
      {{ install_failures | default([]) + ['homebrew: not installed at ' ~ brew_prefix ~ ' (bootstrap.sh installs it); no Homebrew packages'] }}
  when: not brew_stat.stat.exists

- name: Homebrew packages
  when: brew_stat.stat.exists
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ brew_prefix }}/sbin:{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH }}"
    HOMEBREW_NO_ANALYTICS: "1"
    HOMEBREW_NO_INSTALL_CLEANUP: "1"
    # Intel Macs (Tier 3): never update, upgrade or compile on the side
    HOMEBREW_NO_AUTO_UPDATE: "{{ '1' if intel_mac else '' }}"
    HOMEBREW_NO_INSTALL_UPGRADE: "{{ '1' if intel_mac else '' }}"
    HOMEBREW_MAKE_JOBS: "{{ '2' if intel_mac else '' }}"
  block:
    - name: Homebrew | update the formula index
      ansible.builtin.command: brew update
      register: brew_update
      changed_when: false
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: brew_update is succeeded
      ignore_errors: true

    - name: Homebrew | taps and trust
      ansible.builtin.include_tasks: tap.yml
      loop: "{{ packages.taps }}"
      loop_control:
        loop_var: tap

    - name: Homebrew | formulae (Apple Silicon)
      community.general.homebrew:
        name: "{{ item.name }}"
        state: present
      loop: "{{ tool_plan.brew }}"
      loop_control:
        label: "{{ item.name }}"
      register: brew_formulae
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: brew_formulae is succeeded
      ignore_errors: true
      when: not intel_mac

    - name: Homebrew | record formulae that did not install
      ansible.builtin.set_fact:
        install_failures: "{{ install_failures | default([]) + ['brew: ' ~ item.item.name] }}"
      loop: "{{ brew_formulae.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not intel_mac

    - name: Homebrew | formulae (Intel - bottle, else MacPorts, else mise, else skipped)
      when: intel_mac
      block:
        - name: Intel | start the mise fallback list
          ansible.builtin.set_fact:
            intel_mise_fallback: []

        - name: Intel | one formula at a time
          ansible.builtin.include_tasks: intel_formula.yml
          loop: "{{ tool_plan.brew }}"
          loop_control:
            loop_var: formula
            label: "{{ formula.name }}"

        # an older version of these dotfiles wrote the fallbacks here; the mise role puts them in config.toml now
        - name: Intel | old mise fallback config
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/mise/conf.d/intel-fallback.toml"
            state: absent

    - name: Casks and App Store apps
      ansible.builtin.include_tasks: apps.yml
      when: gui_apps | bool

    - name: Remove (remove.brew / cask / mas / port)
      ansible.builtin.include_tasks: darwin_remove.yml

    - name: Homebrew | clean up old versions and downloads
      ansible.builtin.command: brew cleanup
      changed_when: false
      failed_when: false

# platforms.yml `system: port` (an Intel Mac after Homebrew dropped it): ports straight from MacPorts, binary archives
# only; a port_build port itself is compiled, its dependencies are not
- name: MacPorts | ports (platform system is port)
  when: tool_plan.port | length > 0 and macports_fallback | bool
  block:
    - name: MacPorts | installed?
      ansible.builtin.include_tasks: macports.yml
      when: macports_ready is not defined

    - name: MacPorts | ports
      ansible.builtin.script: port-install.sh {{ item | quote }} {{ (item in tool_plan.port_build) | lower }}
      loop: "{{ tool_plan.port }}"
      become: true
      register: ports_result
      changed_when: "'is already installed' not in ports_result.stdout"
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: ports_result is succeeded
      ignore_errors: true
      when: macports_ready | bool

    - name: MacPorts | mise instead, where the entry has a mise_fallback
      ansible.builtin.set_fact:
        intel_mise_fallback: "{{ intel_mise_fallback | default([]) + [tool_plan.port_fallback[item.item]] }}"
      loop: "{{ ports_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.item in tool_plan.port_fallback

    - name: MacPorts | record what did not install
      ansible.builtin.set_fact:
        install_failures: "{{ install_failures | default([]) + ['port: ' ~ item.item] }}"
      loop: "{{ ports_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.item not in tool_plan.port_fallback
