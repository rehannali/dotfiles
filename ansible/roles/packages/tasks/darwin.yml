---
- name: Homebrew | where is it
  ansible.builtin.set_fact:
    brew_prefix: "{{ '/opt/homebrew' if ansible_facts.architecture == 'arm64' else '/usr/local' }}"
    intel_mac: "{{ ansible_facts.system == 'Darwin' and ansible_facts.architecture == 'x86_64' }}"

# Intel Macs have no Homebrew: command-line tools from MacPorts (ports.yml) and mise (roles/mise), apps from mycask
- name: Intel Mac (MacPorts, mise, mycask; no Homebrew)
  when: intel_mac
  environment:
    PATH: "/opt/local/bin:/opt/local/sbin:{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH }}"
  block:
    - name: Intel | command-line tools (MacPorts)
      ansible.builtin.include_tasks: ports.yml

    - name: Intel | casks (mycask)
      ansible.builtin.include_tasks: intel_mycask.yml

    - name: Intel | App Store and GitHub apps
      ansible.builtin.include_tasks: apps.yml
      when: gui_apps | bool

    - name: Intel | remove (remove.cask / mas / port)
      ansible.builtin.include_tasks: darwin_remove.yml

- name: Homebrew | installed?
  ansible.builtin.stat:
    path: "{{ brew_prefix }}/bin/brew"
  register: brew_check
  when: not intel_mac

# Apple Silicon gets everything from Homebrew, so it comes first. Its installer refuses root but runs sudo itself, which
# has no terminal to ask on here: a sudoers drop-in lets this one user's sudo through without a password for the
# install, and is always removed again. (bootstrap.sh installs it the same way, on your terminal.)
- name: Homebrew | install it (Apple Silicon)
  when: not intel_mac and not brew_check.stat.exists and not ansible_check_mode
  block:
    - name: Homebrew | let the installer use sudo, for now
      ansible.builtin.copy:
        dest: /etc/sudoers.d/dotfiles-homebrew-install
        mode: "0440"
        content: "{{ ansible_facts.user_id }} ALL=(ALL) NOPASSWD: ALL\n"
        validate: /usr/sbin/visudo -cf %s
      become: true

    - name: Homebrew | the official installer
      ansible.builtin.shell: >-
        set -o pipefail;
        installer="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        && NONINTERACTIVE=1 /bin/bash -c "$installer"
      args:
        executable: /bin/bash
        creates: "{{ brew_prefix }}/bin/brew"
      register: brew_installer
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: brew_installer is succeeded
  rescue:
    - name: Homebrew | could not be installed
      ansible.builtin.set_fact:
        install_failures: >-
          {{ install_failures | default([]) + ['homebrew: the installer failed ('
             ~ (brew_installer.stderr_lines | default(['?']) | last | truncate(120)) ~ ')'] }}
  always:
    - name: Homebrew | sudo asks again
      ansible.builtin.file:
        path: /etc/sudoers.d/dotfiles-homebrew-install
        state: absent
      become: true

- name: Homebrew | there now?
  ansible.builtin.stat:
    path: "{{ brew_prefix }}/bin/brew"
  register: brew_stat
  when: not intel_mac

- name: Homebrew | missing
  ansible.builtin.set_fact:
    install_failures: >-
      {{ install_failures | default([]) + ['homebrew: not installed at ' ~ brew_prefix ~ '; no Homebrew packages'] }}
  when: not intel_mac and not brew_stat.stat.exists

- name: Homebrew packages
  when: not intel_mac and brew_stat.stat.exists
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ brew_prefix }}/sbin:{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH }}"
    HOMEBREW_NO_ANALYTICS: "1"
    HOMEBREW_NO_INSTALL_CLEANUP: "1"
  block:
    - name: Homebrew | update the formula index
      ansible.builtin.command: brew update
      register: brew_update
      changed_when: false
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: brew_update is succeeded
      ignore_errors: true

    - name: Homebrew | taps and trust
      ansible.builtin.include_tasks: tap.yml
      loop: "{{ packages.taps }}"
      loop_control:
        loop_var: tap

    - name: Homebrew | formulae (Apple Silicon)
      community.general.homebrew:
        name: "{{ item.name }}"
        state: present
      loop: "{{ tool_plan.brew }}"
      loop_control:
        label: "{{ item.name }}"
      register: brew_formulae
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: brew_formulae is succeeded
      ignore_errors: true
      when: not intel_mac

    # every run with upgrade_on_apply (or --tags upgrade): formulae and casks with a newer version
    - name: Homebrew | upgrade (brew upgrade)
      ansible.builtin.command: brew upgrade
      register: brew_upgrade
      changed_when: brew_upgrade.stdout is search('==> Upgrading')
      ignore_errors: true
      when: (upgrade_on_apply | bool or 'upgrade' in ansible_run_tags) and not ansible_check_mode

    - name: Homebrew | record formulae that did not install
      ansible.builtin.set_fact:
        install_failures: "{{ install_failures | default([]) + ['brew: ' ~ item.item.name] }}"
      loop: "{{ brew_formulae.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not intel_mac

    # brew_service in packages.yml
    - name: Homebrew | services
      ansible.builtin.shell: |
        brew list --formula {{ item.name | quote }} > /dev/null 2>&1 || { echo "not from Homebrew"; exit 0; }
        brew services start {{ item.name | quote }}
      loop: "{{ tool_plan.brew | selectattr('service') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: brew_services
      changed_when: "'Successfully started' in brew_services.stdout"
      ignore_errors: true

    - name: Homebrew | record services that did not start
      ansible.builtin.set_fact:
        install_failures: "{{ install_failures | default([]) + ['brew services: ' ~ item.item.name ~ ' did not start'] }}"
      loop: "{{ brew_services.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Casks and App Store apps
      ansible.builtin.include_tasks: apps.yml
      when: gui_apps | bool

    - name: Remove (remove.brew / cask / mas / port)
      ansible.builtin.include_tasks: darwin_remove.yml

    - name: Homebrew | clean up old versions and downloads
      ansible.builtin.command: brew cleanup
      changed_when: false
      failed_when: false
