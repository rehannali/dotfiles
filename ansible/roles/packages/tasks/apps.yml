---
# Some casks are Intel-only; Apple Silicon runs them through Rosetta
- name: Rosetta (Apple Silicon)
  ansible.builtin.command: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
  args:
    creates: /Library/Apple/usr/libexec/oah/libRosettaRuntime
  become: true
  failed_when: false
  when: not intel_mac

- name: Apps | the casks and App Store apps for this Mac (bundles + apps_extra - apps_skip)
  ansible.builtin.set_fact:
    casks_wanted: >-
      {{ apps_wanted | selectattr('cask', 'defined')
         | rejectattr('arch', 'defined') | list
         + (apps_wanted | selectattr('cask', 'defined') | selectattr('arch', 'defined')
            | selectattr('arch', 'equalto', dotfiles_arch) | list)
         if 'cask' in pkg_managers.apps else [] }}
    mas_wanted: >-
      {{ apps_wanted | selectattr('mas', 'defined') | rejectattr('cask', 'defined') | list
         if 'mas' in pkg_managers.apps else [] }}
    github_apps_wanted: >-
      {{ apps_wanted | selectattr('github', 'defined')
         | rejectattr('arch', 'defined') | list
         + (apps_wanted | selectattr('github', 'defined') | selectattr('arch', 'defined')
            | selectattr('arch', 'equalto', dotfiles_arch) | list)
         if 'cask' in pkg_managers.apps else [] }}

- name: Casks | install
  community.general.homebrew_cask:
    name: "{{ item.cask }}"
    state: present
    install_options: "{{ ['appdir=' ~ (settings.macos.cask_appdir | replace('~', ansible_facts.env.HOME))] if item.appdir | default(false) else omit }}"
  loop: "{{ casks_wanted }}"
  loop_control:
    label: "{{ item.name }}"
  register: casks_result
  retries: "{{ install_retries | int - 1 }}"
  delay: "{{ install_delay }}"
  until: casks_result is succeeded
  ignore_errors: true
  when: install_casks | bool and not intel_mac   # Intel: mycask installs them (intel_mycask.yml)

- name: Casks | record what did not install
  ansible.builtin.set_fact:
    install_failures: "{{ install_failures | default([]) + ['cask: ' ~ item.item.name] }}"
  loop: "{{ casks_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "GitHub apps | is this Mac a MacBook (apps with macbook: true need one)"
  ansible.builtin.command: system_profiler SPHardwareDataType
  register: mac_hardware
  changed_when: false
  check_mode: false
  when: install_casks | bool and github_apps_wanted | selectattr('macbook', 'defined') | list | length > 0

- name: GitHub apps | apps from GitHub releases, where there is no cask
  ansible.builtin.include_tasks: github_app.yml
  loop: >-
    {{ github_apps_wanted | rejectattr('macbook', 'defined') | list
       + (github_apps_wanted | selectattr('macbook', 'defined') | list
          if 'Model Name: MacBook' in (mac_hardware.stdout | default('')) else []) }}
  loop_control:
    loop_var: gh_app
    label: "{{ gh_app.name }}"
  when: install_casks | bool

- name: App Store
  when: install_app_store | bool and mas_wanted | length > 0
  vars:
    mas_bin: "{{ '/opt/local/bin/mas' if intel_mac else '/opt/homebrew/bin/mas' }}"
  block:
    - name: App Store | mas (command line for the App Store)
      community.general.homebrew:
        name: mas
        state: present
      register: mas_cli
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: mas_cli is succeeded
      when: not intel_mac   # Intel: the mas port (ports.yml)

    - name: App Store | mas from MacPorts (Intel)
      ansible.builtin.command: /opt/local/bin/mas version
      changed_when: false
      check_mode: false   # only looks, so it runs in --check too
      when: intel_mac

    - name: App Store | apps already installed
      ansible.builtin.command: "{{ mas_bin }} list"
      register: mas_list
      changed_when: false
      failed_when: false
      check_mode: false   # only looks

    # An app is skipped when it is already installed (mas upgrade below updates it). A missing one is got with
    # `mas get` (free apps, also ones this Apple Account never got before: `mas install` only re-downloads, and
    # says "redownload is not available" otherwise), else `mas install` (an app bought earlier). One the account
    # can't get (paid and not bought, or not offered for this Mac) is reported, not an error.
    - name: App Store | get the missing apps (needs a signed-in App Store)
      ansible.builtin.shell: |
        if {{ mas_bin }} get {{ item.mas | quote }}; then echo MAS_OK; exit 0; fi
        if {{ mas_bin }} install {{ item.mas | quote }}; then echo MAS_OK; exit 0; fi
        echo MAS_UNAVAILABLE
      loop: >-
        {{ mas_wanted | rejectattr('mas', 'in', mas_list.stdout_lines | default([]) | select('match', '^\s*\d+\s') | map('trim') | map('split') | map('first')
           | map('int') | list) | list }}
      loop_control:
        label: "{{ item.name }} ({{ item.mas }})"
      become: true   # mas get needs root
      environment:
        MAS_NO_AUTO_INDEX: "1"
      register: mas_result
      changed_when: "'MAS_OK' in mas_result.stdout"
      failed_when: false
      when: not ansible_check_mode

    - name: App Store | record what this Apple Account could not get
      ansible.builtin.set_fact:
        install_failures: >-
          {{ install_failures | default([]) + ['App Store: ' ~ item.item.name ~ ' (' ~ item.item.mas ~ ') skipped, not available
          for this Apple Account (paid and not bought, or not for this Mac)'] }}
      loop: "{{ mas_result.results | default([]) | selectattr('stdout', 'defined') | selectattr('stdout', 'search', 'MAS_UNAVAILABLE') | list }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: App Store | update the apps (mas upgrade)
      ansible.builtin.command: "{{ mas_bin }} upgrade"
      register: mas_upgrade
      changed_when: "'Upgrading' in mas_upgrade.stdout"
      ignore_errors: true

    - name: App Store | update failed
      ansible.builtin.set_fact:
        install_failures: "{{ install_failures | default([]) + ['App Store: mas upgrade failed (signed in?)'] }}"
      when: mas_upgrade is failed
  rescue:
    - name: App Store | mas could not be installed
      ansible.builtin.set_fact:
        install_failures: "{{ install_failures | default([]) + ['App Store: mas could not be installed, no App Store apps'] }}"
