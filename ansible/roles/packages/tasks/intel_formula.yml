---
# One formula on an Intel Mac, down the fallbacks in order:
#   1. Homebrew bottle (formula and every missing dependency have one)
#   2. MacPorts binary archive (`port` in packages.yml; macports_fallback)
#   3. mise (`mise_fallback`), written to conf.d/intel-fallback.toml and installed by the mise role
#   4. build from source, only for mise_intel: false tools (nothing else provides them)
#   5. otherwise reported and skipped; nothing is compiled
- name: "{{ formula.name }} | start"
  ansible.builtin.set_fact:
    formula_done: false
    formula_why: ""

- name: "{{ formula.name }} | installed from Homebrew already?"
  ansible.builtin.command: brew list --formula {{ formula.name }}
  register: formula_listed
  changed_when: false
  failed_when: false

- name: "{{ formula.name }} | installed from MacPorts already?"
  ansible.builtin.command: /opt/local/bin/port installed {{ formula.port }}
  register: formula_ported
  changed_when: false
  failed_when: false
  when: formula.port | length > 0 and formula_listed.rc != 0

- name: "{{ formula.name }} | already there"
  ansible.builtin.set_fact:
    formula_done: true
  when: formula_listed.rc == 0 or '(active)' in (formula_ported.stdout | default(''))

- name: "{{ formula.name }} | missing bottles"
  ansible.builtin.script: brew-unbottled.sh {{ formula.name | quote }} {{ formula.prebuilt | lower }}
  register: formula_unbottled
  changed_when: false
  when: not formula_done

- name: "{{ formula.name }} | from a bottle"
  ansible.builtin.command: >-
    brew install {{ '' if formula.prebuilt else '--force-bottle' }} --formula {{ formula.name }}
  register: formula_bottle
  changed_when: true
  retries: "{{ install_retries | int - 1 }}"
  delay: "{{ install_delay }}"
  until: formula_bottle is succeeded
  ignore_errors: true
  when: not formula_done and formula_unbottled.stdout | trim == ''

- name: "{{ formula.name }} | bottle result"
  ansible.builtin.set_fact:
    formula_done: "{{ formula_bottle is not skipped and formula_bottle is succeeded }}"
    formula_why: "{{ 'brew install failed' if formula_bottle is not skipped else 'no Intel bottle: ' ~ (formula_unbottled.stdout | trim) }}"
  when: not formula_done

- name: "{{ formula.name }} | MacPorts"
  when: not formula_done and formula.port | length > 0 and macports_fallback | bool
  block:
    - name: "{{ formula.name }} | MacPorts installed?"
      ansible.builtin.include_tasks: macports.yml
      when: macports_ready is not defined

    - name: "{{ formula.name }} | MacPorts port {{ formula.port }} (binary archive only)"
      ansible.builtin.command: /opt/local/bin/port -N -b install {{ formula.port }}
      become: true
      register: formula_port
      changed_when: true
      retries: "{{ install_retries | int - 1 }}"
      delay: "{{ install_delay }}"
      until: formula_port is succeeded
      ignore_errors: true
      when: macports_ready | bool

    - name: "{{ formula.name }} | MacPorts result"
      ansible.builtin.set_fact:
        formula_done: "{{ formula_port is succeeded and macports_ready | bool }}"
        formula_why: >-
          {{ formula_why }}; {{ ('MacPorts port ' ~ formula.port ~ ' failed') if macports_ready | bool else 'MacPorts could not be installed' }}

- name: "{{ formula.name }} | mise instead ({{ formula.mise_fallback }})"
  ansible.builtin.set_fact:
    intel_mise_fallback: "{{ intel_mise_fallback + [formula.mise_fallback] }}"
    formula_done: true
  when: not formula_done and formula.mise_fallback | length > 0

- name: "{{ formula.name }} | build from source (nothing else provides it)"
  ansible.builtin.command: brew install --formula {{ formula.name }}
  register: formula_built
  changed_when: true
  ignore_errors: true
  when: not formula_done and formula.source

- name: "{{ formula.name }} | skipped"
  ansible.builtin.set_fact:
    install_failures: "{{ install_failures | default([]) + ['brew (Intel) ' ~ formula.name ~ ': ' ~ formula_why] }}"
  when: not formula_done and (not formula.source or formula_built is failed)
