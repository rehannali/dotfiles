---
# xcodes reads XCODES_USERNAME / XCODES_PASSWORD, and FASTLANE_SESSION with --use-fastlane-auth (no two-factor code).
# From Bitwarden first when it is on (the item apple_id_item / settings.apple.bitwarden_item), else from the
# environment, for anyone without Bitwarden. Never on a command line or in a file.
- name: Credentials | from Bitwarden ({{ xcode_bitwarden_item }})
  ansible.builtin.set_fact:
    xcode_auth_vault:
      XCODES_USERNAME: "{{ lookup('community.general.bitwarden', xcode_bitwarden_item, field='username', search=xcode_bitwarden_search)[0] | default('') }}"
      XCODES_PASSWORD: "{{ lookup('community.general.bitwarden', xcode_bitwarden_item, field='password', search=xcode_bitwarden_search)[0] | default('') }}"
      FASTLANE_SESSION: >-
        {{ (lookup('community.general.bitwarden', xcode_bitwarden_item, field='FASTLANE_SESSION', search=xcode_bitwarden_search,
                   errors='ignore') | default([''], true))[0] | default('') }}
  no_log: true
  failed_when: false
  when: bitwarden | bool and xcode_bitwarden_item not in ['', 'none']

# the Apple ID as a pair from one place: the vault's if it has a username, else the environment's
- name: Credentials | Bitwarden first, then the environment
  ansible.builtin.set_fact:
    xcode_auth_env:
      XCODES_USERNAME: "{{ vault.XCODES_USERNAME if vault.XCODES_USERNAME | default('') else lookup('ansible.builtin.env', 'XCODES_USERNAME') }}"
      XCODES_PASSWORD: "{{ vault.XCODES_PASSWORD if vault.XCODES_USERNAME | default('') else lookup('ansible.builtin.env', 'XCODES_PASSWORD') }}"
      FASTLANE_SESSION: "{{ vault.FASTLANE_SESSION | default('', true) or lookup('ansible.builtin.env', 'FASTLANE_SESSION') }}"
  vars:
    vault: "{{ xcode_auth_vault | default({}) }}"
  no_log: true

- name: Credentials | can a run sign in without a terminal
  ansible.builtin.set_fact:
    xcode_unattended: "{{ (xcode_xip | length > 0) or (xcode_auth_env.FASTLANE_SESSION | length > 0) }}"
