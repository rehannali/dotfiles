---
# xcodes reads XCODES_USERNAME / XCODES_PASSWORD, and FASTLANE_SESSION with --use-fastlane-auth (no two-factor code).
# From the environment, else from Bitwarden when it is on. Never on a command line or in a file.
- name: Credentials | from the environment
  ansible.builtin.set_fact:
    xcode_auth_env:
      XCODES_USERNAME: "{{ lookup('ansible.builtin.env', 'XCODES_USERNAME') }}"
      XCODES_PASSWORD: "{{ lookup('ansible.builtin.env', 'XCODES_PASSWORD') }}"
      FASTLANE_SESSION: "{{ lookup('ansible.builtin.env', 'FASTLANE_SESSION') }}"
  no_log: true

- name: Credentials | from Bitwarden ({{ xcode_bitwarden_item }})
  ansible.builtin.set_fact:
    xcode_auth_env:
      XCODES_USERNAME: "{{ lookup('community.general.bitwarden', xcode_bitwarden_item, field='username')[0] | default('') }}"
      XCODES_PASSWORD: "{{ lookup('community.general.bitwarden', xcode_bitwarden_item, field='password')[0] | default('') }}"
      FASTLANE_SESSION: >-
        {{ xcode_auth_env.FASTLANE_SESSION
           or (lookup('community.general.bitwarden', xcode_bitwarden_item, field='FASTLANE_SESSION', errors='ignore') | default([''], true))[0] }}
  no_log: true
  failed_when: false
  when: bitwarden | bool and not xcode_auth_env.XCODES_USERNAME

- name: Credentials | can a run sign in without a terminal
  ansible.builtin.set_fact:
    xcode_unattended: "{{ (xcode_xip | length > 0) or (xcode_auth_env.FASTLANE_SESSION | length > 0) }}"
