---
# Xcode and the iOS simulator runtime: toolchain.yml (empty = the newest release this Mac can run), or for one run
# -e xcode_version=26.6 / -e ios_runtime=26.5
xcode_version: "{{ toolchain.xcode_version }}"
ios_runtime: "{{ toolchain.ios_runtime }}"
# A Xcode_<version>.xip you downloaded yourself: no Apple ID, no two-factor code
xcode_xip: "{{ lookup('ansible.builtin.env', 'DOTFILES_XCODE_XIP') }}"
# Bitwarden item with the Apple ID (login) and an optional custom field FASTLANE_SESSION, when bitwarden is on
xcode_bitwarden_item: "{{ settings.apple.bitwarden_item }}"
# the item by its id (apple_id_item in the vault can be one, when several items share a name), else by its name
xcode_bitwarden_search: "{{ 'id' if xcode_bitwarden_item is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') else 'name' }}"
# The command a run could not do itself (the Apple ID needs a two-factor code typed on a terminal) is written here;
# bootstrap.sh runs it with your terminal at the end.
xcode_pending_script: "{{ ansible_facts.env.HOME }}/.cache/dotfiles/xcode-install.sh"
# exits 1 with a message when the selected Xcode has no build for this Mac's CPU
xcode_arch_check: >-
  app="$(xcode-select -p)"; app="${app%/Contents/Developer}";
  archs="$(lipo -archs "$app/Contents/MacOS/Xcode" 2> /dev/null)";
  case " $archs " in *" {{ dotfiles_arch }} "*) ;; *) echo "$app is built for: ${archs:-?}, not for this Mac
  ({{ dotfiles_arch }}); reinstall it with xcodes"; exit 1 ;; esac
