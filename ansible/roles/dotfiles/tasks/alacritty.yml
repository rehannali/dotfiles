---
# alacritty.toml imports ~/.config/alacritty/themes/themes/<settings.terminal.alacritty_theme>.toml
- name: Dotfiles | alacritty themes directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/alacritty/themes"
    state: directory
    mode: "0755"

# curl and tar, not unarchive: unarchive wants GNU tar on macOS, which only Homebrew provided
- name: Dotfiles | alacritty themes ({{ dotfiles_alacritty_theme_commit[:7] }})
  ansible.builtin.shell: >-
    set -o pipefail;
    curl -fsSL --retry 3 https://github.com/alacritty/alacritty-theme/archive/{{ dotfiles_alacritty_theme_commit }}.tar.gz
    | tar -xzf - --strip-components=1 -C {{ (ansible_facts.env.HOME ~ '/.config/alacritty/themes') | quote }}
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts.env.HOME }}/.config/alacritty/themes/themes"
  register: dotfiles_themes
  retries: "{{ install_retries | int - 1 }}"
  delay: "{{ install_delay }}"
  until: dotfiles_themes is succeeded
  ignore_errors: true

- name: Dotfiles | alacritty themes not downloaded
  ansible.builtin.set_fact:
    install_failures: "{{ install_failures | default([]) + ['alacritty themes: could not be downloaded'] }}"
  when: dotfiles_themes is failed
