---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
  become: true
  failed_when: false   # not installed yet on the very first run: the package starts it with this config

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  become: true
  failed_when: false
