---
# A Linux server with disks, Docker and network services (a homelab box). Nothing happens unless the machine has
# `server:` in its host_vars or group_vars; host_vars/piserver.yml is the example. Every key is optional:
#
# server:
#   mounts:                 # disks, kept in /etc/fstab and mounted; `nofail` so a missing disk never stops the boot
#     - path: /mnt/kingston2tb
#       src: UUID=...       # `lsblk -f` on the server; empty = not set up yet (reported, nothing mounted)
#       fstype: ext4
#       opts: defaults,nofail,x-systemd.device-timeout=30s
#   swap_size: 2G           # a /swapfile of this size, in /etc/fstab; empty = none
#   ssh:                    # sshd, in /etc/ssh/sshd_config.d/10-dotfiles.conf (applied at the end of the run)
#     port: 2222            # then the inventory needs ansible_port: 2222
#     password_authentication: false
#   authorized_keys: []     # public keys allowed to log in as you (ssh-ed25519 AAAA... comment)
#   docker:                 # Docker Engine from Docker's apt repository
#     data_root: /mnt/kingston2tb/docker              # Docker's own data
#     containerd_root: /mnt/kingston2tb/containerd    # images and containers (the image store since Docker 29)
#     services_dir: /mnt/kingston2tb/docker-services  # one folder per service (compose files); owned by you
#     log_opts: {max-size: 10m, max-file: "3"}        # json-file log options, per container (daemon.json log-opts)
#   cloudflared: true       # Cloudflare Tunnel's client; the tunnel runs when the token is given (secrets below)
#   netbird: true           # NetBird's client; joins the network when a setup key is given (secrets below)
#   speedtest: true         # Ookla's speedtest, their own build for this CPU
#   nextdns:                # NextDNS's CLI as this machine's DNS resolver (/etc/nextdns.conf); the profile id is a
#     listen: [localhost:53]  #  secret (below). Every other key of nextdns.conf can be set here
#     forwarders: []        # "domain=ip:port", e.g. your own zone to your own DNS server
#   samba:                  # Samba, with these shares; give your Samba password once: sudo smbpasswd -a <you>
#     shares: [{name: PiNAS, path: /mnt/kingston2tb}]
#   glances: true           # Glances' web dashboard (pipx), a service on port 61208
#
# Secrets and personal values never go in the repo: they are `private.<host>` (the Bitwarden item "dotfiles.<host>",
# read by vars_plugins/private.py; layout in ansible/private.example.yml), or for one run the environment:
#   cloudflared_token   SERVER_CLOUDFLARED_TOKEN   tunnel token (Cloudflare dashboard, Zero Trust, Networks, Tunnels)
#   netbird_setup_key   SERVER_NETBIRD_SETUP_KEY   setup key (NetBird dashboard, Setup Keys)
#   netbird_management_url, netbird_admin_url      a self-hosted NetBird's URLs (yours, so private too)
#   nextdns_profile     SERVER_NEXTDNS_PROFILE     NextDNS profile id (my.nextdns.io, the id in the URL)
#   samba_password      SERVER_SAMBA_PASSWORD      your Samba password, set once
# Without one, that step is skipped and the report says how to do it by hand.
server_defaults:
  swap_size: ""
  ssh: {}
  authorized_keys: []
  mounts: []
  docker: {}
  cloudflared: false
  netbird: false
  speedtest: false
  nextdns: {}
  samba: {}
  glances: false
server_docker_defaults:
  data_root: /var/lib/docker
  containerd_root: /var/lib/containerd
  services_dir: ""
  log_opts: {max-size: 10m, max-file: "3"}
