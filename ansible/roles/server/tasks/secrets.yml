---
# Secrets for this run, never in the repo: the private values first (`private.<host>`: the Bitwarden item
# "dotfiles.<host>", docs/bitwarden.md), then the environment of the machine running the playbook
# (SERVER_CLOUDFLARED_TOKEN, ...), for anyone without Bitwarden. Missing = that step is skipped and the report says how
# to do it by hand.
- name: Secrets | from the private values, else the environment
  ansible.builtin.set_fact:
    server_secrets:
      cloudflared_token: "{{ server_private.cloudflared_token | default(lookup('ansible.builtin.env', 'SERVER_CLOUDFLARED_TOKEN'), true) }}"
      netbird_setup_key: "{{ server_private.netbird_setup_key | default(lookup('ansible.builtin.env', 'SERVER_NETBIRD_SETUP_KEY'), true) }}"
      nextdns_profile: "{{ server_private.nextdns_profile | default(lookup('ansible.builtin.env', 'SERVER_NEXTDNS_PROFILE'), true) }}"
      samba_password: "{{ server_private.samba_password | default(lookup('ansible.builtin.env', 'SERVER_SAMBA_PASSWORD'), true) }}"
  vars:
    server_private: "{{ private_host | default({}) }}"
  no_log: true
