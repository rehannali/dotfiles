---
# Secrets for this run, never in the repo: the environment of the machine running the playbook first
# (SERVER_CLOUDFLARED_TOKEN, ...), then the private values (`private.<host>`: the Bitwarden folder "dotfiles private",
# docs/bitwarden.md). Missing = that step is skipped and the report says how to do it by hand.
- name: Secrets | from the environment, else the private values
  ansible.builtin.set_fact:
    server_secrets:
      cloudflared_token: "{{ lookup('ansible.builtin.env', 'SERVER_CLOUDFLARED_TOKEN') or server_private.cloudflared_token | default('') }}"
      netbird_setup_key: "{{ lookup('ansible.builtin.env', 'SERVER_NETBIRD_SETUP_KEY') or server_private.netbird_setup_key | default('') }}"
      nextdns_profile: "{{ lookup('ansible.builtin.env', 'SERVER_NEXTDNS_PROFILE') or server_private.nextdns_profile | default('') }}"
      samba_password: "{{ lookup('ansible.builtin.env', 'SERVER_SAMBA_PASSWORD') or server_private.samba_password | default('') }}"
  vars:
    server_private: "{{ (private | default({})).get(inventory_hostname) | default({}, true) }}"
  no_log: true
