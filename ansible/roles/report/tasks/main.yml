---
- name: Report | cache directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.cache/dotfiles"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

# scripts/check-install.py reads this to know what should be on this machine
- name: Report | what this machine should have (for scripts/check-install.py)
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.cache/dotfiles/plan.json"
    mode: "0644"
    content: >-
      {{ {'expect': tool_plan.expect, 'gui_apps': gui_apps | bool,
          'flutter': settings.flutter.version if (install_flutter | bool and gui_apps | bool) else '',
          'cask_appdir': settings.macos.cask_appdir,
          'casks': (apps_wanted | selectattr('cask', 'defined')
                    | rejectattr('arch', 'defined') | list
                    + (apps_wanted | selectattr('cask', 'defined') | selectattr('arch', 'defined')
                       | selectattr('arch', 'equalto', dotfiles_arch) | list))
                   if (dotfiles_os == 'darwin' and gui_apps | bool and install_casks | bool) else [],
          'flatpaks': flatpak_apps | default([]) | map(attribute='flatpak') | list,
          'snaps': snap_apps | default([]) | map(attribute='snap') | list,
          'debs': deb_apps | default([]) | map(attribute='deb') | map(attribute='package') | list}
         | to_nice_json }}
  when: not ansible_check_mode
  failed_when: false

- name: Report | ~/.config/dotfiles
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/dotfiles"
    state: directory
    mode: "0700"
  when: not ansible_check_mode

# `dot` (home/.local/bin/dot) reads this to know which machine it runs on
- name: Report | which machine this is (for dot)
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/dotfiles/machine"
    mode: "0644"
    content: |
      DOTFILES_HOST={{ inventory_hostname }}
      DOTFILES_GROUP={{ (group_names | intersect(['mac_personal', 'mac_work', 'servers', 'wsl', 'linux_desktop']) | first) | default('') }}
  when: not ansible_check_mode

- name: Report | everything was done
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: everything was installed."
  when: install_failures | default([]) | length == 0

- name: Report | NOT done (the rest of the setup went on; run the playbook again once the cause is fixed)
  ansible.builtin.debug:
    msg: "{{ install_failures }}"
  when: install_failures | default([]) | length > 0
