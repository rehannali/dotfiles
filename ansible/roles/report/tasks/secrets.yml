---
# Are this machine's private values and secrets in place? Each check says OK or what is missing; nothing prints a value.
# git name / email in the git config, each environment variable in ~/.config/dotfiles/secrets.zsh (mode 600) with the
# vault's value, the GitHub token accepted by GitHub, the Bitwarden SSH agent answering, the Apple ID readable.
- name: Secrets check | PATH with this setup's tools
  ansible.builtin.set_fact:
    secrets_check_env:
      PATH: >-
        {{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/opt/local/bin:/usr/local/bin:{{
        ansible_facts.env.PATH }}
    secrets_file: "{{ ansible_facts.env.HOME }}/.config/dotfiles/secrets.zsh"
    secrets_env: "{{ dotfiles_secrets | default({}) }}"
  no_log: true

- name: Secrets check | git name and email in the git config
  community.general.git_config_info:
    name: user.{{ item }}
    scope: global
  loop: [name, email]
  register: secrets_git
  failed_when: false
  when: git_name | length > 0 and git_email | length > 0   # else the dotfiles step already said what is missing

- name: Secrets check | secrets.zsh
  ansible.builtin.stat:
    path: "{{ secrets_file }}"
  register: secrets_file_stat
  when: secrets_env | length > 0

# each variable read back from the file as a shell sees it, compared with the vault's value (both only in the environment)
- name: Secrets check | each environment variable in secrets.zsh has the vault's value
  ansible.builtin.shell: |
    . "$SECRETS_FILE" 2> /dev/null && [ "$(printenv "$SECRET_NAME")" = "$SECRET_EXPECTED" ]
  environment:
    SECRETS_FILE: >-
      {{ (ansible_facts.env.HOME ~ '/' ~ dotfiles_env_in_own[item.key]) if item.key in (dotfiles_env_in_own | default({}))
         else secrets_file }}
    SECRET_NAME: "{{ item.key }}"
    SECRET_EXPECTED: "{{ item.value }}"
  args:
    executable: /bin/bash
  loop: "{{ secrets_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: secrets_vars
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Secrets check | GitHub accepts the token (gh auth status)
  ansible.builtin.command: gh auth status --hostname github.com
  environment: "{{ secrets_check_env | combine({'GH_TOKEN': secrets_env.GH_TOKEN | default(secrets_env.GITHUB_TOKEN)}) }}"
  register: secrets_gh
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: secrets_env.GITHUB_TOKEN is defined or secrets_env.GH_TOKEN is defined

# the socket ~/.zshenv points ssh at; 0 = keys there, 1 = agent without keys, 2 = no agent
- name: Secrets check | Bitwarden SSH agent
  ansible.builtin.shell: |
    . "$HOME/.zshenv" > /dev/null 2>&1; [ -n "${SSH_AUTH_SOCK:-}" ] || exit 2; ssh-add -l > /dev/null 2>&1
  args:
    executable: /bin/zsh
  register: secrets_agent
  changed_when: false
  failed_when: false
  check_mode: false
  when: >-
    dotfiles_os == 'darwin' and gui_apps | bool and (settings.shell.bitwarden_ssh_agent | default('auto')) != 'off'
    and lookup('ansible.builtin.env', 'SSH_CONNECTION') | length == 0

- name: Secrets check | the Apple ID item for Xcode
  ansible.builtin.set_fact:
    secrets_apple_id: >-
      {{ (lookup('community.general.bitwarden', apple_item, field='username', errors='ignore',
          search='id' if apple_item is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') else 'name')
          | default([''], true))[0] | default('') | length > 0 }}
  vars:
    apple_item: "{{ settings.apple.bitwarden_item | default('Apple ID') }}"
  failed_when: false
  no_log: true
  when: >-
    dotfiles_os == 'darwin' and gui_apps | bool and install_xcode | bool and bitwarden | bool
    and (settings.apple.bitwarden_item | default('Apple ID')) not in ['', 'none']

- name: Secrets check | results
  ansible.builtin.set_fact:
    secrets_results: >-
      {%- set r = [] -%}
      {%- for res in secrets_git.results | default([]) if res.config_value is defined -%}
      {%-   set want = git_name if res.item == 'name' else git_email -%}
      {%-   set _ = r.append(('OK' if res.config_value == want else 'MISSING') ~ ': git user.' ~ res.item
                             ~ ('' if res.config_value == want else ' is not the vault / inventory value')) -%}
      {%- endfor -%}
      {%- if secrets_env | length > 0 -%}
      {%-   set mode = secrets_file_stat.stat.mode | default('') -%}
      {%-   set _ = r.append(('OK: ' if mode == '0600' else 'MISSING: ') ~ '~/.config/dotfiles/secrets.zsh'
                             ~ (' (mode 600)' if mode == '0600' else (' has mode ' ~ mode ~ ', not 600' if mode else ' is not there'))) -%}
      {%- endif -%}
      {%- for res in secrets_vars.results | default([]) if res.rc is defined -%}
      {%-   set own = (dotfiles_env_in_own | default({})).get(res.item.key) -%}
      {%-   set where = ('~/' ~ own ~ ' (updated in place)') if own else 'secrets.zsh' -%}
      {%-   set _ = r.append(('OK: ' ~ res.item.key ~ ' exported in ' ~ where) if res.rc == 0
                             else ('MISSING: ' ~ res.item.key ~ ' does not have the vault value in ' ~ where)) -%}
      {%- endfor -%}
      {%- if secrets_gh.rc is defined -%}
      {%-   set _ = r.append('OK: GitHub accepts the token (gh)' if secrets_gh.rc == 0
                             else 'MISSING: GitHub rejects the token, or gh is not installed (gh auth status)') -%}
      {%- endif -%}
      {%- if secrets_agent.rc is defined -%}
      {%-   set _ = r.append({0: 'OK: Bitwarden SSH agent has keys',
                              1: 'MISSING: Bitwarden SSH agent runs, but has no keys (add an SSH key item in Bitwarden)'}
                             .get(secrets_agent.rc, 'MISSING: Bitwarden SSH agent not reachable (open Bitwarden: '
                                                    ~ 'Settings, Enable SSH agent)')) -%}
      {%- endif -%}
      {%- if secrets_apple_id is defined -%}
      {%-   set _ = r.append('OK: Apple ID item readable' if secrets_apple_id | bool
                             else 'MISSING: Bitwarden item "' ~ (settings.apple.bitwarden_item | default('Apple ID'))
                                  ~ '" (username, password) for Xcode') -%}
      {%- endif -%}
      {{ r }}

- name: Secrets check | what is in place
  ansible.builtin.debug:
    msg: "{{ secrets_results }}"
  when: secrets_results | length > 0

- name: Secrets check | what is missing goes in the report
  ansible.builtin.set_fact:
    install_failures: >-
      {{ install_failures | default([]) + (secrets_results | select('match', '^MISSING') | map('regex_replace', '^MISSING: ', 'secrets: ')
         | list) }}
