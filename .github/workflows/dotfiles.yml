name: dotfiles

# Runs the dotfiles for real on each supported machine type, through the same entry point you use
# (bootstrap.sh -> ansible/site.yml), then audits the result: every expected command resolves, comes from
# the right package manager, starts, and is built for the right OS and CPU (no macOS binary on Debian, no
# x86_64 binary on Apple Silicon, ...). Debian runs twice: as a server, and as a desktop with its Flathub apps (the
# audit checks they are installed). Casks are checked one at a time by casks-verify.yml.
#
# Runs when, and only when: a pull request targets main, code is pushed to main, or someone starts it by hand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Which machine type to run
        type: choice
        default: all
        options: [all, debian, debian-desktop, mac-intel, mac-arm]
      casks:
        description: "macOS casks: install = really install them (about 70 GUI apps), skip"
        type: choice
        default: install
        options: [install, skip]
      xcode:
        description: "macOS: really install Xcode with xcodes. Needs the FASTLANE_SESSION secret, see docs/ci.md"
        type: choice
        default: skip
        options: [skip, install]
      xcode_version:
        description: "Xcode to install, empty = newest this Mac can run. Pick one the runner image doesn't already have, or nothing gets downloaded"
        type: string
        default: ""
      skip_casks:
        description: "macOS: casks to leave out, space separated. netbird-ui starts a system service with sudo and stalls on a runner"
        type: string
        default: netbird-ui
      runtime:
        description: "macOS: also install the iOS simulator runtime (a multi-GB download)"
        type: choice
        default: skip
        options: [skip, install]

concurrency:
  group: dotfiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate (about a minute): ansible-lint, the package list checks (one manager per tool, tap trust lists),
  # every template rendered for every kind of machine (zsh -n, TOML parse), shellcheck.
  static:
    name: lint + render (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          pipx install --include-deps ansible-lint
          pipx inject ansible-lint pyyaml
          command -v shellcheck > /dev/null || sudo apt-get install -y shellcheck
          command -v zsh > /dev/null || sudo apt-get install -y zsh
      - name: ansible-lint and syntax
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-lint
          ansible-playbook --syntax-check site.yml
      - name: Package list checks
        working-directory: ansible
        run: "$(pipx environment --value PIPX_LOCAL_VENVS)/ansible-lint/bin/python tests/packages_check.py"
      # Every cask, App Store id, Flathub id, GitHub release, Homebrew formula and apt name asked for in its store: a wrong or
      # withdrawn id fails here instead of on a machine. A store that can't be reached only warns.
      - name: Package ids exist in their stores
        working-directory: ansible
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub release apps: the API's limit is 60 requests an hour without it
        run: |
          rc=0
          "$(pipx environment --value PIPX_LOCAL_VENVS)/ansible-lint/bin/python" tests/apps_check.py --markdown "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -eq 2 ]; then echo "::warning::a package store could not be reached, some ids were not checked"; exit 0; fi
          exit "$rc"
      - name: Render every template for every kind of machine
        working-directory: ansible
        run: ansible-playbook -i localhost, -c local tests/render.yml
      - name: shellcheck
        run: shellcheck bootstrap.sh home/.local/bin/dot ansible/roles/packages/files/*.sh tools/mycask/verify-casks.sh

  # Picks the machines: everything on PR/push, one or all on a manual run.
  plan:
    name: choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          all='[
            {"id":"debian",     "group":"servers",      "label":"Debian-based server (Ubuntu runner)", "os":"ubuntu-latest",  "timeout":60},
            {"id":"debian-desktop", "group":"linux_desktop", "label":"Debian-based desktop with Flathub apps (Ubuntu runner)", "os":"ubuntu-latest", "timeout":120},
            {"id":"mac-intel",  "group":"mac_personal", "label":"macOS Intel (x86_64)",                "os":"macos-15-intel", "timeout":150},
            {"id":"mac-arm",    "group":"mac_personal", "label":"macOS Apple Silicon (arm64)",         "os":"macos-latest",   "timeout":150}
          ]'
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = all ]; then
            matrix="$(echo "$all" | jq -c .)"
          else
            matrix="$(echo "$all" | jq -c --arg id "$PLATFORM" '[.[] | select(.id == $id)]')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Running: $matrix"

  apply:
    name: apply · ${{ matrix.label }}
    needs: [static, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Unattended first run: nothing is asked, no App Store, no Apple ID. Pull requests and pushes skip the casks
      # (about 70 GUI apps); a manual run installs them unless you choose otherwise.
      DOTFILES_NAME: CI
      DOTFILES_EMAIL: ci@dotfiles.invalid
      DOTFILES_BITWARDEN: "false"
      DOTFILES_MAS: skip
      # Xcode needs an Apple ID, so it is only installed when a manual run asks for it. The Apple secrets are
      # only put in the environment then, never for pull requests or pushes.
      DOTFILES_XCODE: ${{ inputs.xcode == 'install' && 'install' || 'skip' }}
      DOTFILES_XCODE_VERSION: ${{ inputs.xcode_version }}
      DOTFILES_RUNTIME: ${{ inputs.runtime == 'install' && 'install' || 'skip' }}
      FASTLANE_SESSION: ${{ inputs.xcode == 'install' && secrets.FASTLANE_SESSION || '' }}
      DOTFILES_CASKS: ${{ inputs.casks || 'skip' }}
      DOTFILES_SKIP_CASKS: ${{ inputs.skip_casks }}
      DOTFILES_SOURCE: ${{ github.workspace }}
      # mise resolves GitHub releases through the API; an authenticated token avoids anonymous rate limits.
      MISE_GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_ANALYTICS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then sw_vers; sysctl -n machdep.cpu.brand_string; fi
          echo "group=${{ matrix.group }} casks=$DOTFILES_CASKS"

      - name: Apple session present?
        if: ${{ inputs.xcode == 'install' && runner.os == 'macOS' }}
        run: |
          if [ -z "${FASTLANE_SESSION:-}" ]; then
            echo "::error::xcode=install needs the FASTLANE_SESSION secret (a runner can't type the two-factor code). See docs/ci.md"
            exit 1
          fi

      # Intel Macs have no Homebrew (MacPorts and mise install their tools, mycask their apps), but the runner image comes
      # with one in /usr/local, whose commands would hide the planned ones. Remove it as on the real Mac, with its links,
      # so this run installs every tool and cask the way the Mac does.
      - name: Remove Homebrew (Intel runner)
        if: matrix.id == 'mac-intel'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uninstall.sh" https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh
          NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/uninstall.sh" --force
          sudo rm -rf /usr/local/Homebrew /usr/local/Caskroom /usr/local/Cellar /usr/local/var/homebrew
          for d in bin sbin opt lib include share etc; do
            [ -d "/usr/local/$d" ] && sudo find -L "/usr/local/$d" -maxdepth 4 -type l -exec rm -f {} + || true
          done
          if [ -e /usr/local/bin/brew ]; then echo "::error::brew is still there"; exit 1; fi

      # The entry point you run on a real machine, against this checkout instead of GitHub. The Intel runner's apps
      # (Chrome, Firefox, ...) are already in /Applications: mycask takes them over, as on a Mac coming from Homebrew.
      - name: bootstrap.sh --host ci --group ${{ matrix.group }}
        id: apply
        env:
          DOTFILES_ANSIBLE_ARGS: ${{ matrix.id == 'mac-intel' && '-e mycask_adopt=true' || '' }}
        run: |
          set -o pipefail
          bash bootstrap.sh --host ci --group ${{ matrix.group }} 2>&1 | tee "$RUNNER_TEMP/ansible.log"

      - name: Audit (expected tools, architecture, runtimes, shell, profile)
        if: ${{ !cancelled() && steps.apply.conclusion != 'skipped' }}
        run: python3 scripts/check-install.py | tee "$RUNNER_TEMP/audit.md"

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/ansible.log
            ${{ runner.temp }}/audit.md
          if-no-files-found: ignore
          retention-days: 14
