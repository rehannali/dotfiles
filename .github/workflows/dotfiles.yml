name: dotfiles

# Runs the dotfiles for real on each supported machine type, through the same entry point you use
# (bootstrap.sh -> chezmoi init --apply), then audits the result: every expected command resolves, comes from
# the right package manager, starts, and is built for the right OS and CPU (no macOS binary on Debian, no
# x86_64 binary on Apple Silicon, ...).
#
# Runs when, and only when: a pull request targets main, code is pushed to main, or someone starts it by hand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Which machine type to run
        type: choice
        default: all
        options: [all, debian, debian-cli, mac-intel, mac-arm]
      casks:
        description: "macOS casks: install = really install them, check = only verify they are installable here, skip"
        type: choice
        default: install
        options: [install, check, skip]
      xcode:
        description: "macOS: really install Xcode with xcodes. Needs the FASTLANE_SESSION secret, see docs/ci.md"
        type: choice
        default: skip
        options: [skip, install]
      xcode_version:
        description: "Xcode to install, empty = newest this Mac can run. Pick one the runner image doesn't already have, or nothing gets downloaded"
        type: string
        default: ""
      runtime:
        description: "macOS: also install the iOS simulator runtime (a multi-GB download)"
        type: choice
        default: skip
        options: [skip, install]

concurrency:
  group: dotfiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate (about a minute): render every template for every target and profile, then bash -n,
  # shellcheck, "other OS renders empty", valid mise TOML and "one package manager per tool".
  static:
    name: render + lint (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        shell: bash
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/chezmoi-bin"
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"
      - name: shellcheck and zsh available
        shell: bash
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          command -v zsh >/dev/null || sudo apt-get install -y zsh
      - name: Render and lint
        shell: bash
        run: bash scripts/verify-render.sh "$RUNNER_TEMP/rendered"

  # Picks the machines: everything on PR/push, one or all on a manual run.
  plan:
    name: choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          all='[
            {"id":"debian",     "profile":"full", "label":"Debian-based (Ubuntu runner, same as WSL2)", "os":"ubuntu-latest",  "timeout":60},
            {"id":"debian-cli", "profile":"cli",  "label":"Debian-based, cli profile (server)",         "os":"ubuntu-latest",  "timeout":60},
            {"id":"mac-intel",  "profile":"full", "label":"macOS Intel (x86_64)",                       "os":"macos-15-intel", "timeout":150},
            {"id":"mac-arm",    "profile":"full", "label":"macOS Apple Silicon (arm64)",                "os":"macos-latest",   "timeout":150}
          ]'
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = all ]; then
            matrix="$(echo "$all" | jq -c .)"
          else
            matrix="$(echo "$all" | jq -c --arg id "$PLATFORM" '[.[] | select(.id == $id)]')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Running: $matrix"

  apply:
    name: apply · ${{ matrix.label }}
    needs: [static, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Unattended first run: nothing is asked, no App Store, no Apple ID. Pull requests and pushes only verify
      # the casks (about 70 GUI apps); a manual run installs them unless you choose otherwise.
      DOTFILES_NAME: CI
      DOTFILES_EMAIL: ci@dotfiles.invalid
      DOTFILES_PROFILE: ${{ matrix.profile }}
      DOTFILES_BITWARDEN: "false"
      DOTFILES_MAS: skip
      # Xcode needs an Apple ID, so it is only installed when a manual run asks for it. The Apple secrets are
      # only put in the environment then, never for pull requests or pushes.
      DOTFILES_XCODE: ${{ inputs.xcode == 'install' && 'install' || 'skip' }}
      DOTFILES_XCODE_VERSION: ${{ inputs.xcode_version }}
      DOTFILES_RUNTIME: ${{ inputs.runtime == 'install' && 'install' || 'skip' }}
      FASTLANE_SESSION: ${{ inputs.xcode == 'install' && secrets.FASTLANE_SESSION || '' }}
      DOTFILES_CASKS: ${{ inputs.casks || 'check' }}
      DOTFILES_SOURCE: ${{ github.workspace }}
      DOTFILES_CHEZMOI_ARGS: --verbose
      # mise resolves GitHub releases through the API; an authenticated token avoids anonymous rate limits.
      MISE_GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_ANALYTICS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then sw_vers; sysctl -n machdep.cpu.brand_string; fi
          echo "profile=$DOTFILES_PROFILE casks=$DOTFILES_CASKS"

      - name: Apple session present?
        if: ${{ inputs.xcode == 'install' && runner.os == 'macOS' }}
        run: |
          if [ -z "${FASTLANE_SESSION:-}" ]; then
            echo "::error::xcode=install needs the FASTLANE_SESSION secret (a runner can't type the two-factor code). See docs/ci.md"
            exit 1
          fi

      # The entry point you run on a real machine, against this checkout instead of GitHub.
      - name: bootstrap.sh
        id: apply
        run: |
          set -o pipefail
          bash bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/chezmoi-apply.log"

      # bootstrap.sh keeps no chezmoi behind; the audit needs one to read this machine's tool plan.
      - name: Install chezmoi for the audit
        if: ${{ !cancelled() && steps.apply.conclusion != 'skipped' }}
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/chezmoi-bin"
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"

      - name: Audit (expected tools, architecture, runtimes, shell, profile)
        if: ${{ !cancelled() && steps.apply.conclusion != 'skipped' }}
        run: python3 scripts/check-install.py --source "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/audit.md"

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/chezmoi-apply.log
            ${{ runner.temp }}/audit.md
          if-no-files-found: ignore
          retention-days: 14
