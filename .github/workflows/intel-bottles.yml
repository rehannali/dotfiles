name: intel-bottles

# Homebrew no longer builds bottles for Intel Macs (Tier 3 since September 2026). This builds the ones the Intel Mac
# needs on GitHub's Intel runner: only formulae (and their dependencies, build tools like rust and go included) with no
# usable Homebrew Intel bottle for the current version. Until August 2027 there is no MacPorts or mise stand-in (platforms.yml, `fallbacks: false`),
# so every command-line tool in tools/mycask/intel/formulae.txt is either a Homebrew bottle or built here. They go into
# one rolling release, intel-bottles, with an index.json that mycask (tools/mycask) reads on the Mac, which installs a
# formula's dependencies first and skips the ones it already has.
#
# Once a week the plan (cheap, no Mac runner) compares each formula's pkg_version with index.json; only what Homebrew
# updated since, or what is new in the list, is built. Each bottle is published as soon as it is built, so a job that runs
# out of time (6 hours) loses nothing: the run has four build passes one after the other, and each plans again and
# carries on with what is left. A formula that fails is not tried again in the same run.
#
# After the builds, two jobs install everything the Intel Macs ask for the way a Mac does, with mycask on a runner
# without Homebrew, and check the result from mycask's receipts (tools/mycask/verify.py): every command-line tool
# (a second install must change nothing), and every cask, one at a time. So a push shows whether the utility really
# installs all the tools and casks. They run on pushes to main and feat/ansible, and on the weekly run.
#
# macos-15-intel is the last Intel runner and is gone after August 2027: from 2027-08-01 the workflow stops itself,
# and the bottles already in the release stay there, frozen.

on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays; builds only what changed
  workflow_dispatch:
  push:
    branches: [main, feat/ansible]
    paths:
      - tools/mycask/intel/formulae.txt
      - tools/mycask/intel/casks.txt
      - tools/mycask/intel/cli-map.json
      - tools/mycask/mycask.py
      - tools/mycask/verify.py
      - tools/mycask/verify-casks.sh
      - .github/workflows/intel-bottles.yml

# one run at a time; a second one waits, so two runs never upload to the release together
concurrency:
  group: intel-bottles
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE: intel-bottles
  BASE_URL: https://github.com/${{ github.repository }}/releases/download/intel-bottles
  # The Intel Mac runs macOS 26 (Tahoe), but bottles from the macOS 15 runner are tagged sequoia: plan for the
  # runner's macOS, never a newer one. Sequoia bottles run on Sequoia and Tahoe.
  PLAN_TAG: sequoia

jobs:
  plan:
    name: what needs a bottle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      stop: ${{ steps.guard.outputs.stop }}
    steps:
      # The Intel runner is retired after August 2027: stop with a notice, not a failure
      - name: Date guard
        id: guard
        run: |
          if [ "$(date -u +%Y-%m-%d)" \> "2027-07-31" ]; then
            echo "::notice::macos-15-intel is gone after August 2027; no more Intel bottles. The release keeps the existing ones."
            echo "stop=true" >> "$GITHUB_OUTPUT"
          fi

      # The repo: mycask and the committed Intel lists (tools/mycask/intel, written from packages.yml)
      - name: Checkout
        if: steps.guard.outputs.stop != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # mycask's plan is read-only and works on Linux. A missing release or index.json (the very first run) only gives
      # a warning: then nothing counts as built yet. HOME and the cache point at a temp directory.
      - name: Plan (mycask formula plan)
        id: plan
        if: steps.guard.outputs.stop != 'true'
        env:
          HOME: ${{ runner.temp }}/home
          MYCASK_CACHE: ${{ runner.temp }}/mycask-cache
          MYCASK_ROOT: ${{ runner.temp }}/mycask-root
          MYCASK_BOTTLES_URL: ${{ env.BASE_URL }}/index.json
          MYCASK_CLI_MAP: ${{ github.workspace }}/tools/mycask/intel/cli-map.json
        run: |
          mkdir -p "$HOME"
          python3 tools/mycask/mycask.py formula plan --tag "$PLAN_TAG" --file tools/mycask/intel/formulae.txt --build-deps --json > plan.json
          build="$(jq -c '[.build[].name]' plan.json)"   # already in dependency order
          echo "build=$build" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan for $PLAN_TAG"
            echo
            echo "| formula | from | detail |"
            echo "|---|---|---|"
            jq -r '.items[] | "| \(.name) | \(.action) | \(.spec // (.missing | if . then join(", ") else null end) // .detail // "") |"' plan.json
            echo
            echo "To build, in order: $(jq -r '[.build[].name] | join(" ")' plan.json)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "To build: $build"

  # Four passes, one at a time. Each starts a runner, plans again against the release as it is now, and builds what is
  # left; a pass with nothing left finishes in a minute. Together that is up to about 21 hours of building for the
  # first fill of the release, after which a run only builds what Homebrew bumped.
  build:
    name: build bottles, pass ${{ matrix.pass }} (macos-15-intel)
    needs: plan
    if: needs.plan.outputs.stop != 'true' && needs.plan.outputs.build != '' && needs.plan.outputs.build != '[]'
    runs-on: macos-15-intel
    # GitHub-hosted jobs stop after 6 hours. No new build starts after 5h20m (BUDGET). A single formula that needs more
    # than 6 hours (llvm, rust and what builds them) never finishes: such a tool is better left out of packages.yml, or
    # given a `port` / `mise_fallback` once `fallbacks` is switched on.
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pass: [1, 2, 3, 4]
    env:
      GH_TOKEN: ${{ github.token }}
      BUDGET: 19200
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # What an earlier pass of this run could not build; not tried again
      - name: Failures of earlier passes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: failed.txt
          key: failed-${{ github.run_id }}-${{ matrix.pass }}
          restore-keys: failed-${{ github.run_id }}-

      - name: Plan for this pass
        env:
          HOME: ${{ runner.temp }}/home
          MYCASK_CACHE: ${{ runner.temp }}/mycask-cache
          MYCASK_ROOT: ${{ runner.temp }}/mycask-root
          MYCASK_BOTTLES_URL: ${{ env.BASE_URL }}/index.json
          MYCASK_CLI_MAP: ${{ github.workspace }}/tools/mycask/intel/cli-map.json
        run: |
          mkdir -p "$HOME"
          touch failed.txt
          /usr/bin/python3 -I tools/mycask/mycask.py formula plan --tag "$PLAN_TAG" --file tools/mycask/intel/formulae.txt --build-deps --json > plan.json
          build="$(jq -c '[.build[].name]' plan.json)"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          if [ "$build" = "[]" ]; then echo "todo=false" >> "$GITHUB_ENV"; echo "Nothing left to build."; else echo "todo=true" >> "$GITHUB_ENV"; fi
          echo "To build: $build"

      # Downloads (source tarballs, poured dependency bottles) from earlier runs; saved again under this run's key
      - name: Homebrew download cache
        if: env.todo == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-intel-${{ github.run_id }}-${{ matrix.pass }}
          restore-keys: homebrew-intel-

      # Current formulae first, then nothing may update or check dependents behind our back. Building from source and
      # `brew bottle` need the formula files, so homebrew/core is tapped instead of only using the API.
      - name: Homebrew up to date
        if: env.todo == 'true'
        run: |
          brew update
          {
            echo HOMEBREW_NO_AUTO_UPDATE=1
            echo HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
            echo HOMEBREW_NO_INSTALL_FROM_API=1
            echo HOMEBREW_NO_ANALYTICS=1
          } >> "$GITHUB_ENV"
          HOMEBREW_NO_INSTALL_FROM_API=1 brew tap --force homebrew/core

      # In the plan's order (dependencies first), one formula at a time: build, bottle, add it to index.json, upload. A
      # preinstalled copy on the runner image is removed first, so the formula is really built with --build-bottle.
      # Dependencies (runtime and build tools like rust and go) that this repo's CI built in an earlier pass are poured
      # into the runner's Cellar first (restore_deps), so they are not compiled again; if that fails for one, Homebrew
      # builds it, as it would have done anyway. One that fails is reported; the rest still build and upload.
      - name: Build, bottle and publish
        if: env.todo == 'true'
        run: |
          start="$(date +%s)"
          mkdir -p prev
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" --title "Intel bottles" --latest=false \
                 --notes "Homebrew bottles for Intel Macs, built by .github/workflows/intel-bottles.yml. Read by tools/mycask (index.json)."
          gh release download "$RELEASE" --pattern index.json --dir prev 2> /dev/null || echo "no index.json yet"
          if [ -f prev/index.json ]; then cp prev/index.json index.json; else echo '{"formulae": {}}' > index.json; fi

          restore_deps() {
            local dep url ver file
            for dep in $(brew deps --formula --include-build "$1" 2> /dev/null); do
              brew list --formula "$dep" > /dev/null 2>&1 && continue
              url="$(jq -r --arg d "$dep" --arg t "$PLAN_TAG" '.formulae[$d].files[$t].url // empty' index.json)"
              ver="$(jq -r --arg d "$dep" '.formulae[$d].pkg_version // empty' index.json)"
              [ -n "$url" ] && [ -n "$ver" ] || continue
              file="$RUNNER_TEMP/dep.tar.gz"
              if curl -fsSL "$url" -o "$file" && tar -xzf "$file" -C "$(brew --cellar)" \
                  && ln -sfn "../Cellar/$dep/$ver" "$(brew --prefix)/opt/$dep"; then
                brew link --overwrite "$dep" > /dev/null 2>&1 || true   # keg-only formulae stay unlinked
                echo "restored $dep $ver from the release"
              else
                echo "::warning::could not restore $dep from the release; Homebrew builds it"
              fi
            done
          }

          built="" failed="" left="" skipped=""
          for name in $(jq -r '.[]' <<< "$BUILD"); do
            if grep -qxF "$name" failed.txt; then skipped="$skipped $name"; continue; fi
            if [ $(( $(date +%s) - start )) -gt "$BUDGET" ]; then left="$left $name"; continue; fi
            echo "::group::$name"
            restore_deps "$name"
            brew uninstall --ignore-dependencies "$name" > /dev/null 2>&1 || true
            rm -rf out && mkdir out
            if brew install --build-bottle "$name" \
                && (cd out && brew bottle --json --root-url="$BASE_URL" "$name") \
                && /usr/bin/python3 -I tools/mycask/mycask.py formula ci-index --bottle-dir out --base-url "$BASE_URL" \
                     --existing index.json --out index.json.new \
                && mv index.json.new index.json \
                && gh release upload "$RELEASE" out/*.tar.gz index.json --clobber; then
              built="$built $name"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$name did not build"
              failed="$failed $name"
              echo "$name" >> failed.txt
            fi
          done
          {
            echo "built=${built# }"
            echo "failed=${failed# }"
            echo "left=${left# }"
            echo "skipped=${skipped# }"
          } >> "$GITHUB_ENV"

      # Assets index.json no longer points at (older versions) are deleted
      - name: Remove old assets
        if: env.todo == 'true'
        run: |
          keep="$(jq -r '.formulae[].files[].url | split("/") | last' index.json; echo index.json)"
          gh release view "$RELEASE" --json assets -q '.assets[].name' | while read -r asset; do
            if ! grep -qxF "$asset" <<< "$keep"; then
              echo "deleting $asset"
              gh release delete-asset "$RELEASE" "$asset" --yes
            fi
          done

      - name: Result
        if: env.todo == 'true'
        run: |
          {
            echo "### Pass ${{ matrix.pass }}"
            echo "published: ${built:-nothing}"
            echo "failed: ${failed:-none}"
            echo "failed in an earlier pass, not tried: ${skipped:-none}"
            echo "left for the next pass: ${left:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then echo "::error::did not build: $failed"; exit 1; fi
          echo "built and published: ${built:-nothing}${left:+; left for the next pass: $left}"

  # Every command-line tool the Intel Macs ask for, installed by mycask on a runner without Homebrew, from the release as
  # it is now. Then the same install again: it must change nothing (dependencies already there are skipped). The check
  # reads mycask's receipts: keg, links, dependencies, and that each command starts (no missing library, right CPU).
  verify-formulae:
    name: verify command-line tools (mycask, macos-15-intel)
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.stop != 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MYCASK_BOTTLES_URL: https://github.com/${{ github.repository }}/releases/download/intel-bottles/index.json
      MYCASK_CLI_MAP: ${{ github.workspace }}/tools/mycask/intel/cli-map.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # Intel Macs have no Homebrew and mycask refuses to share /usr/local with it (same step as dotfiles.yml)
      - name: Remove Homebrew
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uninstall.sh" https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh
          NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/uninstall.sh" --force
          sudo rm -rf /usr/local/Homebrew /usr/local/Caskroom /usr/local/Cellar /usr/local/var/homebrew
          for d in bin sbin opt lib include share etc; do
            [ -d "/usr/local/$d" ] && sudo find -L "/usr/local/$d" -maxdepth 4 -type l -exec rm -f {} + || true
          done
          if [ -e /usr/local/bin/brew ]; then echo "::error::brew is still there"; exit 1; fi

      # `formula setup` asks for sudo itself; mycask refuses to run as root
      - name: mycask formula setup
        run: /usr/bin/python3 -I tools/mycask/mycask.py formula setup

      # A tool that cannot be installed is reported here and again, with the reason, in the check below
      - name: Install every tool (mycask formula bundle)
        run: |
          /usr/bin/python3 -I tools/mycask/mycask.py formula bundle tools/mycask/intel/formulae.txt 2>&1 | tee "$RUNNER_TEMP/install.log" || true
          grep -E '^Error: ' "$RUNNER_TEMP/install.log" || true

      - name: Install again, nothing may change
        run: |
          /usr/bin/python3 -I tools/mycask/mycask.py formula bundle tools/mycask/intel/formulae.txt 2>&1 | tee "$RUNNER_TEMP/again.log" || true
          if grep -E ' installed$' "$RUNNER_TEMP/again.log"; then
            echo "::error::a second install installed something again; dependencies already there must be skipped"
            exit 1
          fi

      - name: Check what was installed
        run: |
          echo "### Command-line tools" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/python3 -I tools/mycask/verify.py --formulae tools/mycask/intel/formulae.txt --markdown "$RUNNER_TEMP/formulae.md" || rc=$?
          cat "$RUNNER_TEMP/formulae.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-formulae
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/again.log
            ${{ runner.temp }}/formulae.md
          if-no-files-found: ignore
          retention-days: 14

  # Every cask the Intel Macs ask for, installed by mycask one at a time and checked from its receipt (app or binary in
  # place, commands start), then uninstalled again to leave the runner's small disk free. See verify-casks.sh.
  verify-casks:
    name: verify casks (mycask, macos-15-intel)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.stop != 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install and check each cask
        run: |
          rc=0
          bash tools/mycask/verify-casks.sh tools/mycask/intel/casks.txt "$RUNNER_TEMP/casks.md" || rc=$?
          { echo "### Casks"; cat "$RUNNER_TEMP/casks.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-casks
          path: ${{ runner.temp }}/casks.md
          if-no-files-found: ignore
          retention-days: 14
