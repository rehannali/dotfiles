name: ansible

# The Ansible setup (ansible/). Lint and the package-plan check on every change; a real run on Ubuntu as a server;
# the Macs on a manual run (they take long and install a lot).
on:
  pull_request:
    branches: [main]
    paths: [ansible/**, bootstrap.sh, home/**, .github/workflows/ansible.yml]
  push:
    branches: [main]
    paths: [ansible/**, bootstrap.sh, home/**, .github/workflows/ansible.yml]
  workflow_dispatch:
    inputs:
      macs:
        description: Also run on the macOS runners (Apple Silicon and Intel), as a work Mac without casks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint + plan parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          pipx install --include-deps ansible-lint
          pipx inject ansible-lint pyyaml
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: ansible-lint
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-lint
          ansible-playbook --syntax-check site.yml
      - name: tool_plan filter decides like chezmoi's tool-plan
        working-directory: ansible
        run: "$(pipx environment --value PIPX_LOCAL_VENVS)/ansible-lint/bin/python tests/tool_plan_parity.py"

  apply-linux:
    name: apply · Ubuntu as a server
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTFILES_NAME: CI
      DOTFILES_EMAIL: ci@dotfiles.invalid
      DOTFILES_SOURCE: ${{ github.workspace }}
      # nothing that needs an Apple ID or a signed-in App Store on a runner
      DOTFILES_ANSIBLE_ARGS: -e install_casks=false -e install_app_store=false
      DOTFILES_XCODE: skip
      DOTFILES_MAS: skip
      MISE_GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap.sh --host ci --group servers
        shell: bash
        run: bash bootstrap.sh --host ci --group servers 2>&1 | tee "$RUNNER_TEMP/ansible.log"
      - name: Keep the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ansible-servers-ubuntu
          path: ${{ runner.temp }}/ansible.log
          retention-days: 14

  apply-mac:
    name: apply · ${{ matrix.label }}
    needs: lint
    if: ${{ inputs.macs }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "macOS Apple Silicon as a work Mac", os: macos-latest}
          - {label: "macOS Intel as a work Mac", os: macos-15-intel}
    env:
      DOTFILES_NAME: CI
      DOTFILES_EMAIL: ci@dotfiles.invalid
      DOTFILES_SOURCE: ${{ github.workspace }}
      # nothing that needs an Apple ID or a signed-in App Store on a runner
      DOTFILES_ANSIBLE_ARGS: -e install_casks=false -e install_app_store=false
      DOTFILES_XCODE: skip
      DOTFILES_MAS: skip
      MISE_GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap.sh --host ci --group mac_work
        shell: bash
        run: bash bootstrap.sh --host ci --group mac_work 2>&1 | tee "$RUNNER_TEMP/ansible.log"
      - name: Keep the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ansible-mac_work-${{ matrix.os }}
          path: ${{ runner.temp }}/ansible.log
          retention-days: 14
