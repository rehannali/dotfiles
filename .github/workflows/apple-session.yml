name: apple-session

# Creates the FASTLANE_SESSION secret that lets dotfiles.yml install Xcode on a runner without anyone typing
# Apple's two-factor code. Manual only, and only needed now and then (the session runs out after about a month).
#
# A runner can't answer the code prompt, so this opens an SSH terminal on the runner for you (upterm). In it you
# run `get-session`, type the Apple password and the code, and the session goes straight into the repository
# secret. It is never put in a variable (variables are plain text) and never in a workflow log.
#
# Writing a secret needs more than the job's own token can do. Either save a fine-grained token once as the
# environment secret SECRETS_WRITE_TOKEN (docs/ci.md), and nothing has to be typed, or log in to GitHub in the
# terminal with `gh auth login -w` each time.
#
# This is a public repository, so who may run this is locked down in four places:
#   1. the Actions variable APPLE_SESSION_USER holds the only GitHub user allowed to start it (guard job)
#   2. only that user's SSH keys are accepted in the terminal (limit-access-to-users)
#   3. the job uses the "apple-session" environment, where you can require your own approval (docs/ci.md)
#   4. the one third-party action (upterm) is pinned to an exact commit
#
# Read docs/ci.md first: it explains the relay (default server or your own) and the settings to switch on.

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: Apple ID to sign in with (a dedicated one is best)
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    name: only the allowed user
    runs-on: ubuntu-latest
    steps:
      - name: Check who started this
        env:
          ALLOWED: ${{ vars.APPLE_SESSION_USER }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$ALLOWED" ]; then
            echo "::error::Set the Actions variable APPLE_SESSION_USER to your GitHub username first (docs/ci.md)."
            exit 1
          fi
          if [ "${ACTOR,,}" != "${ALLOWED,,}" ]; then
            echo "::error::This workflow can only be started by $ALLOWED, not by $ACTOR."
            exit 1
          fi

  session:
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 30
    environment: apple-session
    env:
      FASTLANE_OPT_OUT_USAGE: "YES"      # no usage analytics from fastlane
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      # Homebrew is on the runner already. The fastlane formula brings its own Ruby, so no Ruby setup is needed.
      - name: Install fastlane and the get-session / save-session commands
        env:
          APPLE_ID: ${{ inputs.apple_id }}
          # only this step gets the token; the third-party upterm action below never sees it
          SECRETS_WRITE_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install fastlane

          # values go in files, never into the scripts' text, so nothing in them needs quoting
          state="$HOME/.apple-session"
          mkdir -p "$state" "$HOME/.local/bin"
          chmod 700 "$state"
          printf '%s' "$APPLE_ID" > "$state/apple-id"
          printf '%s' "$GITHUB_REPOSITORY" > "$state/repo"
          if [ -n "$SECRETS_WRITE_TOKEN" ]; then
            (umask 077; printf '%s' "$SECRETS_WRITE_TOKEN" > "$state/token")
            echo "SECRETS_WRITE_TOKEN found, the session will be saved without a GitHub login."
          else
            echo "No SECRETS_WRITE_TOKEN: you will log in with gh auth login -w in the terminal."
          fi

          cat > "$HOME/.local/bin/get-session" << 'SCRIPT'
          #!/bin/bash
          # Sign in to Apple and store the session as the repository secret FASTLANE_SESSION.
          set -euo pipefail
          state="$HOME/.apple-session"
          out="$state/spaceauth.txt"
          # fastlane only asks for the password and the code when its output is a terminal, so it must not be piped.
          # `script` keeps the terminal and writes a copy of everything printed to a file. CI variables are cleared
          # because fastlane treats a CI as "can't ask", and the keychain is skipped (it would only prompt).
          env -u CI -u GITHUB_ACTIONS -u GITHUB_ACTION FASTLANE_DONT_STORE_PASSWORD=1 \
            script -q "$out" fastlane spaceauth -u "$(cat "$state/apple-id")" --copy_to_clipboard false || true
          # The session is the line after "Pass the following ...". It is one line (newlines written as \n) and
          # wrapped in colour codes; the terminal capture also has carriage returns.
          session="$(tr -d '\r' < "$out" | perl -pe 's/\e\[[0-9;]*m//g' | awk '/Pass the following via the FASTLANE_SESSION/ {on = 1; next} on && NF {print; exit}')"
          rm -f "$out"
          if [ -z "$session" ]; then
            echo "Could not find the session in the output above." >&2
            exit 1
          fi
          printf '%s\n' "$session" > "$state/session"
          chmod 600 "$state/session"
          if [ -s "$state/token" ] || gh auth status > /dev/null 2>&1; then
            save-session
          else
            echo
            echo "Signed in. Now run:  gh auth login -w    (approve the code in your browser)"
            echo "then:                save-session"
          fi
          SCRIPT

          cat > "$HOME/.local/bin/save-session" << 'SCRIPT'
          #!/bin/bash
          # Put the session into the repository secret FASTLANE_SESSION and delete it from this machine.
          set -euo pipefail
          state="$HOME/.apple-session"
          [ -s "$state/session" ] || { echo "No session yet, run get-session first." >&2; exit 1; }
          if [ -s "$state/token" ]; then
            GH_TOKEN="$(cat "$state/token")"
            export GH_TOKEN
          fi
          if ! gh secret set FASTLANE_SESSION --repo "$(cat "$state/repo")" < "$state/session"; then
            if [ -s "$state/token" ]; then
              echo "The saved SECRETS_WRITE_TOKEN was refused (expired?). Run: rm $state/token; gh auth login -w; save-session" >&2
            fi
            exit 1
          fi
          rm -f "$state/session"
          echo "Saved as the secret FASTLANE_SESSION. Type exit to end this run."
          SCRIPT

          chmod +x "$HOME/.local/bin/get-session" "$HOME/.local/bin/save-session"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fastlane --version

      # Prints the "ssh ..." line to run, in the log of this step. Ends by itself if nobody connects within 15 minutes.
      # The server is upterm's public one unless the variables UPTERM_SERVER and UPTERM_KNOWN_HOSTS point at your own.
      - name: Open a terminal for you (run the ssh line from this log)
        uses: owenthereal/action-upterm@b9dfa526f890bbd5162d781f8d9c69b97731d73d   # v2.7.0
        with:
          limit-access-to-users: ${{ vars.APPLE_SESSION_USER }}
          upterm-server: ${{ vars.UPTERM_SERVER || 'ssh://uptermd.upterm.dev:22' }}
          known-hosts: ${{ vars.UPTERM_KNOWN_HOSTS }}
          wait-timeout-minutes: 15
      # In the terminal:
      #   gh auth login -w      (only without SECRETS_WRITE_TOKEN; approve the code on github.com/login/device)
      #   get-session           (Apple password and the code Apple sends to your device)
      #   exit
