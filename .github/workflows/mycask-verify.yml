name: mycask-verify

# Checks that mycask really installs every cask the Intel Macs ask for (GUI apps, and the command-line tools that ship
# as casks: claude-code, codex). On a clean macos-15-intel runner, every cask in tools/mycask/intel/casks.txt is installed
# one at a time (verify-casks.sh), checked from mycask's receipt by tools/mycask/verify.py (app or binary in place,
# commands start), and uninstalled again to keep the runner's disk free. A table in the run's summary says what is
# missing or broken, and the run fails. The command-line tools (MacPorts, mise) are checked by dotfiles.yml.
#
# Runs when the mycask code or list changes (pull request to main, push to main or feat/ansible), once a week (a cask's
# new version may drop Intel), and by hand. macos-15-intel is gone after August 2027: from 2027-08-01 it stops itself.

on:
  pull_request:
    branches: [main]
    paths:
      - tools/mycask/**
      - .github/workflows/mycask-verify.yml
  push:
    branches: [main, feat/ansible]
    paths:
      - tools/mycask/**
      - .github/workflows/mycask-verify.yml
  schedule:
    - cron: "23 5 * * 2"   # Tuesdays
  workflow_dispatch:

concurrency:
  group: mycask-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Intel runner still there?
    runs-on: ubuntu-latest
    outputs:
      stop: ${{ steps.guard.outputs.stop }}
    steps:
      - name: Date guard
        id: guard
        run: |
          if [ "$(date -u +%Y-%m-%d)" \> "2027-07-31" ]; then
            echo "::notice::macos-15-intel is gone after August 2027; nothing to verify on it."
            echo "stop=true" >> "$GITHUB_OUTPUT"
          fi

  # Every cask the Intel Macs ask for, installed by mycask one at a time and checked from its receipt (app or binary in
  # place, commands start), then uninstalled again to leave the runner's small disk free. See verify-casks.sh.
  verify-casks:
    name: verify casks (mycask, macos-15-intel)
    needs: guard
    if: needs.guard.outputs.stop != 'true'

    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install and check each cask
        run: |
          rc=0
          bash tools/mycask/verify-casks.sh tools/mycask/intel/casks.txt "$RUNNER_TEMP/casks.md" || rc=$?
          { echo "### Casks"; cat "$RUNNER_TEMP/casks.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-casks
          path: ${{ runner.temp }}/casks.md
          if-no-files-found: ignore
          retention-days: 14
