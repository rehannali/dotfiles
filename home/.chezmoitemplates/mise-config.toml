{{- $plan := includeTemplate "tool-plan" . | fromJson -}}
# Generated by chezmoi (home/.chezmoitemplates/mise-config.toml). Edit .chezmoidata/packages.yml, not this file.
# Override per project with a mise.toml in that repo.
[tools]

# Language runtimes: every machine. Replaces pyenv, rbenv, rvm, sdkman and brew-installed languages.
{{ range $name, $version := .packages.runtimes -}}
{{ $name | quote }} = {{ $version | toJson }}
{{ end -}}
{{- if $plan.mise }}

# CLI tools: only where Homebrew is not the source (Intel Macs and Linux). See README "Package policy".
{{ range $plan.mise -}}
{{ . | quote }} = "latest"
{{ end -}}
{{- end }}
