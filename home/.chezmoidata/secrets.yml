# Environment variables whose values are kept in Bitwarden instead of in this repo.
#
# They only take effect when Bitwarden is switched on (`bitwarden = true` in ~/.config/chezmoi/chezmoi.toml,
# asked by `chezmoi init`, or DOTFILES_BITWARDEN=true). chezmoi then writes them as `export NAME='value'` to
# ~/.config/dotfiles/secrets.zsh (mode 600), which .zshrc and .bashrc read. Without Bitwarden nothing is
# fetched and no file is written.
#
# item   name (or id) of the Bitwarden item
# field  password (default) | username | notes | the name of a custom field on the item
#
# Example:
#
#   secrets:
#     env:
#       GITHUB_TOKEN:
#         item: GitHub personal access token
#       NPM_TOKEN:
#         item: npmjs
#         field: token          # a custom field called "token"
#
# Files (ssh keys, certificates) can be fetched the same way from an item's attachments, with the
# bitwardenAttachmentByRef template function; see https://www.chezmoi.io/user-guide/password-managers/bitwarden/
secrets:
  env: {}
